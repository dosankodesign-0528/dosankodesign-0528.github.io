<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>キービジュアル V2 — カンプ忠実版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kv.css?v=3">
</head>
<body>

<header class="kv-header">
  <img class="logo" src="assets/header-logo.svg" alt="Anyflow Embed">
  <nav>
    <div class="links"><span>ビジョン</span><span>提供できること</span><span>使用イメージ</span><span>導入事例</span></div>
    <div class="cta">お問い合わせ</div>
  </nav>
</header>

<div class="kv-copy">
  <div class="eyebrow">APIでデータを繋ぐプラットフォーム</div>
  <h1>AIと事業を<br>強くする</h1>
</div>

<div id="kv"></div>

<div class="kv-ticker">
  <div class="track">
    <div class="set">
      <img src="../assets/logo-1.png" alt=""><img src="../assets/logo-2.png" alt=""><img src="../assets/logo-3.png" alt="">
      <img src="../assets/logo-4.png" alt=""><img src="../assets/logo-5.png" alt=""><img src="../assets/logo-6.png" alt="">
      <img src="../assets/logo-7.png" alt="">
    </div>
    <div class="set">
      <img src="../assets/logo-1.png" alt=""><img src="../assets/logo-2.png" alt=""><img src="../assets/logo-3.png" alt="">
      <img src="../assets/logo-4.png" alt=""><img src="../assets/logo-5.png" alt=""><img src="../assets/logo-6.png" alt="">
      <img src="../assets/logo-7.png" alt="">
    </div>
  </div>
</div>

<div class="kv-bar">
  <b>KV V2</b>
  <span class="sep"></span>
  箱:
  <button data-bs="flat" class="on">普通</button>
  <button data-bs="iso">アイソメ</button>
  <button data-bs="solid">3D</button>
  <span class="sep"></span>
  中央:
  <button data-am="grad" class="on">グラデ（カンプ3枚）</button>
  <button data-am="halftone">ハーフトーン（V1.0）</button>
</div>

<script src="engine.js?v=3"></script>
<script>
  KV.start({ mount: 'kv' });
  document.querySelectorAll('.kv-bar [data-bs]').forEach(b => b.onclick = () => {
    KV.setBoxStyle(b.dataset.bs);
    document.querySelectorAll('.kv-bar [data-bs]').forEach(x => x.classList.toggle('on', x === b));
  });
  document.querySelectorAll('.kv-bar [data-am]').forEach(b => b.onclick = () => {
    KV.setAgentMode(b.dataset.am);
    document.querySelectorAll('.kv-bar [data-am]').forEach(x => x.classList.toggle('on', x === b));
  });
</script>
</body>
</html>
