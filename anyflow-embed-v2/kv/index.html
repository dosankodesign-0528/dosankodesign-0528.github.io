<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>キービジュアル V2 — カンプ忠実版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kv.css?v=8">
</head>
<body>

<header class="kv-header">
  <img class="logo" src="assets/header-logo.svg" alt="Anyflow Embed">
  <nav>
    <div class="links"><span>ビジョン</span><span>提供できること</span><span>使用イメージ</span><span>導入事例</span></div>
    <div class="cta">お問い合わせ</div>
  </nav>
</header>

<div class="kv-copy">
  <div class="eyebrow">APIでデータを繋ぐプラットフォーム</div>
  <h1>AIと事業を<br>強くする</h1>
</div>

<div id="kv"></div>

<div class="kv-ticker">
  <div class="track">
    <div class="set">
      <img src="../assets/logo-1.png" alt=""><img src="../assets/logo-2.png" alt=""><img src="../assets/logo-3.png" alt="">
      <img src="../assets/logo-4.png" alt=""><img src="../assets/logo-5.png" alt=""><img src="../assets/logo-6.png" alt="">
      <img src="../assets/logo-7.png" alt="">
    </div>
    <div class="set">
      <img src="../assets/logo-1.png" alt=""><img src="../assets/logo-2.png" alt=""><img src="../assets/logo-3.png" alt="">
      <img src="../assets/logo-4.png" alt=""><img src="../assets/logo-5.png" alt=""><img src="../assets/logo-6.png" alt="">
      <img src="../assets/logo-7.png" alt="">
    </div>
  </div>
</div>

<div class="kv-bar">
  <div class="row1">
    <b>KV V2</b>
    <span class="sep"></span>
    ビュー:
    <button data-view="flat" class="on">普通</button>
    <button data-view="d3">3D</button>
    <button data-view="iso1">アイソメ</button>
    <button data-view="iso2">浅め</button>
    <button data-view="iso3">深め</button>
    <button data-view="iso4">右流し</button>
    <span class="sep"></span>
    中央:
    <button data-am="flow0" class="on">一方向</button>
    <button data-am="flow1">混ざる</button>
    <button data-am="flow2">端→中央</button>
    <button data-am="flow3">軸ゆらぎ</button>
    <button data-am="flow4">中央→端</button>
    <button data-am="halftone">ハーフトーン</button>
    <span class="sep"></span>
    アイコンの動き:
    <button data-ia="on" class="on">オン</button>
    <button data-ia="off">オフ</button>
  </div>
  <div class="row2">
    角度
    X <input type="range" id="rx" min="0" max="72" step="1" value="0"><span id="rxv">0°</span>
    Y <input type="range" id="ry" min="-45" max="45" step="1" value="0"><span id="ryv">0°</span>
    Z <input type="range" id="rz" min="-90" max="90" step="1" value="0"><span id="rzv">0°</span>
    大きさ <input type="range" id="rs" min="0.8" max="1.5" step="0.02" value="1"><span id="rsv">×1.00</span>
  </div>
  <div class="row4" id="flowRow"></div>
  <div class="row3">
    アイコン色:
    <label>📁<input type="color" data-ic="folder" value="#379FFF"><input type="text" data-ih="folder" value="#379FFF" maxlength="7"></label>
    <label>✉️<input type="color" data-ic="mail" value="#379FFF"><input type="text" data-ih="mail" value="#379FFF" maxlength="7"></label>
    <label>📅<input type="color" data-ic="cal" value="#379FFF"><input type="text" data-ih="cal" value="#379FFF" maxlength="7"></label>
    <label>📊<input type="color" data-ic="chart" value="#379FFF"><input type="text" data-ih="chart" value="#379FFF" maxlength="7"></label>
    <button id="icReset">元に戻す</button>
  </div>
</div>

<script src="engine.js?v=8"></script>
<script>
  KV.start({ mount: 'kv' });

  const sliders = { x: rx, y: ry, z: rz, s: rs };
  const labels = { x: rxv, y: ryv, z: rzv, s: rsv };
  function syncSliders(v) {
    sliders.x.value = v.x; sliders.y.value = v.y; sliders.z.value = v.z; sliders.s.value = v.s;
    labels.x.textContent = v.x + '°'; labels.y.textContent = v.y + '°';
    labels.z.textContent = v.z + '°'; labels.s.textContent = '×' + (+v.s).toFixed(2);
  }
  document.querySelectorAll('.kv-bar [data-view]').forEach(b => b.onclick = () => {
    const v = KV.VIEWS[b.dataset.view];
    KV.setView(v); syncSliders(v);
    document.querySelectorAll('.kv-bar [data-view]').forEach(x => x.classList.toggle('on', x === b));
  });
  Object.keys(sliders).forEach(k => sliders[k].addEventListener('input', () => {
    const v = { x: +rx.value, y: +ry.value, z: +rz.value, s: +rs.value };
    KV.setView(v); syncSliders(v);
    document.querySelectorAll('.kv-bar [data-view]').forEach(x => x.classList.remove('on'));
  }));
  /* ===== フローごとの調整スライダー（2026-08-19 ヒデさん指定）=====
     選んだフローに関係する項目だけを row4 に出す */
  const FLOW_SLIDERS = {
    flow0: [['speed','流れる速度',0.005,0.12,0.005],['scale','帯の広がり',0.3,1.6,0.05]],
    flow1: [['speed','流れる速度',0.005,0.12,0.005],['scale','帯の広がり',0.3,1.6,0.05],
            ['mixAmp','混ざり強さ',0,1.2,0.05],['mixSpeed','混ざり速さ',0.01,0.3,0.01]],
    flow2: [['radSpeed','流れる速度',0.005,0.1,0.005],['radScale','リング密度',0.3,1.6,0.05]],
    flow3: [['speed','流れる速度',0.005,0.12,0.005],['scale','帯の広がり',0.3,1.6,0.05],
            ['swayAmp','揺れ幅',0,1.0,0.05],['swaySpeed','揺れ速さ',0.02,0.5,0.01]],
    flow4: [['radSpeed','流れる速度',0.005,0.1,0.005],['radScale','リング密度',0.3,1.6,0.05]],
    halftone: [['htSpeed','波の速さ',0.05,0.9,0.05],['htSwell','うねり',0,0.9,0.05]],
  };
  function buildFlowRow(mode) {
    const row = document.getElementById('flowRow');
    const defs = FLOW_SLIDERS[mode] || [];
    const P = KV.getParams();
    row.innerHTML = defs.map(([k, label, min, max, step]) =>
      `<span class="fl">${label}
        <input type="range" data-fp="${k}" min="${min}" max="${max}" step="${step}" value="${P[k]}">
        <em data-fv="${k}">${P[k]}</em></span>`).join('');
    row.querySelectorAll('[data-fp]').forEach(inp => inp.addEventListener('input', () => {
      KV.setParam(inp.dataset.fp, inp.value);
      row.querySelector(`[data-fv="${inp.dataset.fp}"]`).textContent = (+inp.value).toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
    }));
  }
  document.querySelectorAll('.kv-bar [data-am]').forEach(b => b.onclick = () => {
    KV.setAgentMode(b.dataset.am);
    buildFlowRow(b.dataset.am);
    document.querySelectorAll('.kv-bar [data-am]').forEach(x => x.classList.toggle('on', x === b));
  });
  buildFlowRow('flow0');

  /* アイコンのループアニメ オン/オフ（2026-08-19 ヒデさん指定。オフ＝カンプの静止状態） */
  document.querySelectorAll('.kv-bar [data-ia]').forEach(b => b.onclick = () => {
    KV.setIconAnim(b.dataset.ia === 'on');
    document.querySelectorAll('.kv-bar [data-ia]').forEach(x => x.classList.toggle('on', x === b));
  });

  /* アイコン色: カラーピッカー(直感) と HEX入力(コード指定) を同期 */
  document.querySelectorAll('[data-ic]').forEach(p => p.addEventListener('input', () => {
    const id = p.dataset.ic;
    KV.setIconColor(id, p.value);
    document.querySelector(`[data-ih="${id}"]`).value = p.value.toUpperCase();
  }));
  document.querySelectorAll('[data-ih]').forEach(t => t.addEventListener('change', () => {
    const id = t.dataset.ih;
    let v = t.value.trim(); if (v && v[0] !== '#') v = '#' + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) {
      KV.setIconColor(id, v);
      t.value = v.toUpperCase();
      document.querySelector(`[data-ic="${id}"]`).value = v;
    }
  }));
  document.getElementById('icReset').onclick = () => {
    ['folder','mail','cal','chart'].forEach(id => {
      KV.setIconColor(id, '');
      document.querySelector(`[data-ic="${id}"]`).value = '#379FFF';
      document.querySelector(`[data-ih="${id}"]`).value = '#379FFF';
    });
  };
</script>
</body>
</html>
