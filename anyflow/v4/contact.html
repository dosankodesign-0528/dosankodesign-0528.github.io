<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お問い合わせ｜Anyflow Embed</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="description" content="Anyflow Embed へのお問い合わせフォームです。API連携にまつわるご相談はこちらから。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;200;300;400&display=swap" rel="stylesheet">
  <style>
    /* 【V4.0 2026-09-09】お問い合わせページ（ミニマム構成）。
       デザイントーンは index.html に準拠：Noto Sans JP Light、地#F2F2F2、ボタン#090909、
       ブランドピンク/シアン、線 #ACACAC。HubSpot フォームを埋め込むだけの1画面。 */
    :root {
      --ink: #101828;
      --ink-strong: #000;
      --ink-on-dark: #fff;
      --ink-muted: #555;
      --surface-body: #F2F2F2;   /* 本サイトの地 */
      --surface-card: #fff;
      --surface-cta: #090909;
      --brand-pink: #FF5D97;
      --brand-cyan: #0EBBFF;
      --line-grid: #ACACAC;
      --radius-xs: 4px;
      --radius-md: 8px;
      --radius-lg: 14px;
      --t-fast: .18s;
      --e-out: cubic-bezier(.2,.7,.1,1);

      /* 縦の余白は本サイトのスペーシングに合わせる */
      --gap-16: 16px;
      --gap-24: 24px;
      --gap-32: 32px;
      --gap-40: 40px;
      --gap-56: 56px;
      --gap-72: 72px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', -apple-system, 'system-ui', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 300;
      color: var(--ink);
      background: var(--surface-body);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }

    /* ---- ヘッダー(ロゴ) ---- */
    .site-header {
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 24px 0;
    }
    .site-header .logo img { display: block; height: 33px; width: auto; }

    /* ---- メイン ---- */
    main {
      flex: 1 0 auto;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 72px 24px 96px;
    }
    /* デスクトップで少し余裕を持たせる */
    @media (min-width: 768px) {
      main { padding: 96px 24px 120px; }
    }

    /* ---- 見出し ---- */
    .contact-head { margin: 0 0 var(--gap-40); }
    .contact-eyebrow {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 300; letter-spacing: .06em;
      color: var(--ink);
    }
    .contact-eyebrow::before {
      content: ''; width: 10px; height: 1px; background: var(--ink);
    }
    .contact-title {
      margin: 12px 0 0;
      font-weight: 300;
      font-size: 32px;
      line-height: 1.4;
      color: var(--ink-strong);
      letter-spacing: .02em;
    }
    .contact-lead {
      margin: 16px 0 0;
      font-size: 14px;
      line-height: 1.9;
      color: var(--ink);
    }
    @media (min-width: 768px) {
      .contact-title { font-size: 40px; }
      .contact-lead { font-size: 15px; }
    }

    /* ---- フォームカード ---- */
    .form-card {
      background: var(--surface-card);
      border: 1px solid var(--line-grid);
      border-radius: var(--radius-lg);
      padding: 32px 24px;
    }
    @media (min-width: 768px) {
      .form-card { padding: 40px 40px; }
    }

    /* HubSpot 側の既定スタイルを本サイトのトーンに寄せる（軽い上書き）
       ⚠️ HubSpot が生成するクラス名は基本的に安定。壊れる可能性はゼロではないので仮置き。 */
    .hs-form-frame { font-family: inherit !important; }
    .form-card .hs-form fieldset { max-width: none !important; }
    .form-card label,
    .form-card .hs-form-field > label { font-weight: 300 !important; font-size: 13px !important; color: var(--ink) !important; }
    .form-card input[type="text"],
    .form-card input[type="email"],
    .form-card input[type="tel"],
    .form-card input[type="number"],
    .form-card textarea,
    .form-card select {
      font-family: inherit !important;
      font-size: 15px !important;
      color: var(--ink) !important;
      background: #fff !important;
      border: 1px solid var(--line-grid) !important;
      border-radius: var(--radius-md) !important;
      padding: 10px 12px !important;
      width: 100% !important;
      box-sizing: border-box !important;
      transition: border-color var(--t-fast) var(--e-out);
    }
    .form-card input:focus, .form-card textarea:focus, .form-card select:focus {
      outline: none !important;
      border-color: var(--ink) !important;
    }
    .form-card .hs-form-required, .form-card .hs-error-msg { color: var(--brand-pink) !important; font-size: 12px !important; }
    .form-card .hs-form-field { margin-bottom: 16px !important; }
    .form-card .hs-button {
      background: var(--surface-cta) !important;
      color: var(--ink-on-dark) !important;
      border: none !important;
      border-radius: var(--radius-xs) !important;
      padding: 12px 32px !important;
      font-size: 14px !important;
      font-weight: 300 !important;
      font-family: inherit !important;
      cursor: pointer !important;
      transition: opacity var(--t-fast) var(--e-out) !important;
    }
    .form-card .hs-button:hover { opacity: .82 !important; }

    /* ---- フッター ---- */
    .site-footer {
      max-width: 640px; width: 100%; margin: 0 auto;
      padding: 24px 24px 40px;
      font-size: 12px; color: var(--ink-muted);
    }
    .site-footer a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
    .site-footer a:hover { color: var(--ink); }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/" aria-label="Anyflow Embed トップへ">
      <img src="assets/header-logo.svg" alt="Anyflow Embed">
    </a>
  </header>

  <main>
    <div class="contact-head">
      <span class="contact-eyebrow">Contact</span>
      <h1 class="contact-title">お問い合わせ</h1>
      <p class="contact-lead">API連携にまつわるお悩み、その他ご相談はAnyflowにお任せください。<br>下記フォームよりお問い合わせください。</p>
    </div>

    <section class="form-card" aria-label="お問い合わせフォーム">
      <div id="hs-form"></div>
    </section>
  </main>

  <footer class="site-footer">
    <a href="/">← トップへ戻る</a>
    <span style="margin: 0 8px;">·</span>
    © Anyflow Inc.
  </footer>

  <!-- HubSpot フォーム埋め込み -->
  <script charset="utf-8" type="text/javascript" src="//js.hsforms.net/forms/embed/v2.js"></script>
  <script>
    (function () {
      function boot() {
        if (typeof hbspt === 'undefined' || !hbspt.forms) { setTimeout(boot, 100); return; }
        hbspt.forms.create({
          portalId: "47236172",
          formId: "6db15437-1dd9-4e3b-b562-6f6f323e42a8",
          region: "na1",
          target: "#hs-form"
        });
      }
      boot();
    })();
  </script>
</body>
</html>
