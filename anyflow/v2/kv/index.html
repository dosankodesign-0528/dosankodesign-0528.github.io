<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>キービジュアル V2 — カンプ忠実版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kv.css?v=12">
<link rel="stylesheet" href="patterns.css?v=9">
</head>
<body>

<header class="kv-header">
  <img class="logo" src="assets/header-logo.svg" alt="Anyflow Embed">
  <nav>
    <div class="links"><span>ビジョン</span><span>提供できること</span><span>使用イメージ</span><span>導入事例</span></div>
    <div class="cta">お問い合わせ</div>
  </nav>
</header>

<div class="kv-copy">
  <div class="eyebrow">APIでデータを繋ぐプラットフォーム</div>
  <h1>AIと事業を<br>強くする</h1>
</div>

<div id="kv"></div>
<div id="kvp"></div>
<div id="kvBlender" class="hidden"><img src="assets/kv-hero-3d.png?v=1" alt="Blender 3D キービジュアル"></div>

<div class="kv-ticker">
  <div class="track">
    <div class="set">
      <img src="../assets/logo-1.png" alt=""><img src="../assets/logo-2.png" alt=""><img src="../assets/logo-3.png" alt="">
      <img src="../assets/logo-4.png" alt=""><img src="../assets/logo-5.png" alt=""><img src="../assets/logo-6.png" alt="">
      <img src="../assets/logo-7.png" alt="">
    </div>
    <div class="set">
      <img src="../assets/logo-1.png" alt=""><img src="../assets/logo-2.png" alt=""><img src="../assets/logo-3.png" alt="">
      <img src="../assets/logo-4.png" alt=""><img src="../assets/logo-5.png" alt=""><img src="../assets/logo-6.png" alt="">
      <img src="../assets/logo-7.png" alt="">
    </div>
  </div>
</div>

<div class="kv-bar">
  <div class="row0">
    <b>デザイン</b>
    <button data-design="agent" class="on">エージェント版</button>
    <span class="sep"></span>
    <button data-design="p1" title="フラット×回路線×白箱">A</button>
    <button data-design="p2" title="フラット×同心円×ガラス">B</button>
    <button data-design="p3" title="アイソメ×回路線×ガラス">C</button>
    <button data-design="p4" title="アイソメ×軌道×白箱">D</button>
    <button data-design="p5" title="同心円＋周回ドット＋アニメmock">E</button>
    <span class="sep"></span>
    <button data-design="blender">Blender版</button>
  </div>
  <div class="row1">
    <b>KV V2</b>
    <span class="sep"></span>
    ビュー:
    <button data-view="flat" class="on">普通</button>
    <button data-view="d3">3D</button>
    <button data-view="iso1">アイソメ</button>
    <button data-view="iso2">浅め</button>
    <button data-view="iso3">深め</button>
    <button data-view="iso4">右流し</button>
    <span class="sep"></span>
    中央:
    <button data-am="flow0" class="on">一方向</button>
    <button data-am="flow1">混ざる</button>
    <button data-am="flow2">端→中央</button>
    <button data-am="flow3">軸ゆらぎ</button>
    <button data-am="flow4">中央→端</button>
    <button data-am="halftone">ハーフトーン</button>
    <span class="sep"></span>
    アイコンの動き:
    <button data-ia="on" class="on">オン</button>
    <button data-ia="off">オフ</button>
  </div>
  <div class="rowE">
    浮遊(E):
    <button data-float="on" class="on">オン</button>
    <button data-float="off">オフ</button>
    <span class="sep"></span>
    パララックス(E):
    <button data-parallax="off" class="on">オフ</button>
    <button data-parallax="on">オン</button>
  </div>
  <div class="row2">
    角度
    X <input type="range" id="rx" min="-30" max="72" step="1" value="0"><span id="rxv">0°</span>
    Y <input type="range" id="ry" min="-45" max="45" step="1" value="0"><span id="ryv">0°</span>
    Z <input type="range" id="rz" min="-90" max="90" step="1" value="0"><span id="rzv">0°</span>
    大きさ <input type="range" id="rs" min="0.8" max="1.5" step="0.02" value="1"><span id="rsv">×1.00</span>
  </div>
</div>

<script src="engine.js?v=12"></script>
<script src="patterns.js?v=9"></script>
<script>
  KV.start({ mount: 'kv' });
  KVP.start({ mount: 'kvp' });

  const kvHost = document.getElementById('kv');
  const kvBlender = document.getElementById('kvBlender');
  const row1 = document.querySelector('.kv-bar .row1');
  const rowE = document.querySelector('.kv-bar .rowE');
  let curDesign = 'agent';

  const labels = { x: rxv, y: ryv, z: rzv, s: rsv };
  function syncLabels(v) {
    labels.x.textContent = v.x + '°'; labels.y.textContent = v.y + '°';
    labels.z.textContent = v.z + '°'; labels.s.textContent = '×' + (+v.s).toFixed(2);
  }
  function readSliders() { return { x: +rx.value, y: +ry.value, z: +rz.value, s: +rs.value }; }
  /* 角度XYZ・大きさ: エージェント版=KV.setView / A〜E=選択案の傾き・拡大(KVP.setTransform) */
  [rx, ry, rz, rs].forEach(sl => sl.addEventListener('input', () => {
    const v = readSliders(); syncLabels(v);
    if (curDesign === 'agent') { KV.setView(v); document.querySelectorAll('.kv-bar [data-view]').forEach(x => x.classList.remove('on')); }
    else if (curDesign !== 'blender') KVP.setTransform(v);
  }));

  /* エージェント版の操作（row1） */
  document.querySelectorAll('.kv-bar [data-view]').forEach(b => b.onclick = () => {
    const v = KV.VIEWS[b.dataset.view]; KV.setView(v);
    rx.value = v.x; ry.value = v.y; rz.value = v.z; rs.value = v.s; syncLabels(v);
    document.querySelectorAll('.kv-bar [data-view]').forEach(x => x.classList.toggle('on', x === b));
  });
  document.querySelectorAll('.kv-bar [data-am]').forEach(b => b.onclick = () => {
    KV.setAgentMode(b.dataset.am);
    document.querySelectorAll('.kv-bar [data-am]').forEach(x => x.classList.toggle('on', x === b));
  });
  document.querySelectorAll('.kv-bar [data-ia]').forEach(b => b.onclick = () => {
    KV.setIconAnim(b.dataset.ia === 'on');
    document.querySelectorAll('.kv-bar [data-ia]').forEach(x => x.classList.toggle('on', x === b));
  });

  /* 浮遊 / パララックス（E専用） */
  document.querySelectorAll('.kv-bar [data-float]').forEach(b => b.onclick = () => {
    KVP.setFloat(b.dataset.float === 'on');
    document.querySelectorAll('.kv-bar [data-float]').forEach(x => x.classList.toggle('on', x === b));
  });
  document.querySelectorAll('.kv-bar [data-parallax]').forEach(b => b.onclick = () => {
    KVP.setParallax(b.dataset.parallax === 'on');
    document.querySelectorAll('.kv-bar [data-parallax]').forEach(x => x.classList.toggle('on', x === b));
  });

  /* デザイン切替（エージェント / A〜E / Blender版） */
  function resetSliders() { rx.value = 0; ry.value = 0; rz.value = 0; rs.value = 1; syncLabels(readSliders()); }
  document.querySelectorAll('.kv-bar [data-design]').forEach(b => b.onclick = () => {
    document.querySelectorAll('.kv-bar [data-design]').forEach(x => x.classList.toggle('on', x === b));
    const d = b.dataset.design; curDesign = d;
    const isAgent = d === 'agent', isBlender = d === 'blender';
    kvHost.style.display = isAgent ? '' : 'none';
    kvBlender.classList.toggle('hidden', !isBlender);
    row1.style.display = isAgent ? '' : 'none';
    rowE.style.display = (d === 'p5') ? '' : 'none';
    if (isAgent || isBlender) { KVP.hide(); }
    else { KVP.show(); KVP.setPattern(d); resetSliders(); KVP.setTransform(readSliders()); }
  });
  rowE.style.display = 'none';
</script>
</body>
</html>
