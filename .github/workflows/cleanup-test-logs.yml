name: cleanup test logs (one-shot)

on:
  workflow_dispatch:
    inputs:
      ids:
        description: '削除対象ページIDのカンマ区切り（空ならデフォルト7件のテストデータ）'
        required: false
        default: ''
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: eigyo-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: eigyo-tracker/package-lock.json
      - run: npm ci
      - name: Cleanup
        run: npx tsx src/cleanup-test-logs.ts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          CLEANUP_IDS: ${{ inputs.ids }}
