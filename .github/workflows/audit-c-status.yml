name: audit C-status (one-shot)

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: '過去何日のメールをチェックするか'
        required: false
        default: '14'
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: eigyo-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: eigyo-tracker/package-lock.json
      - run: npm ci
      - name: Audit
        run: npx tsx src/audit-c-status.ts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_COMPANIES_DB_ID: ${{ secrets.NOTION_COMPANIES_DB_ID }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
