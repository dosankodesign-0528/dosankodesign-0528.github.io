name: eigyo-tracker weekly report

on:
  schedule:
    # 毎週月曜 0:00 UTC = JST 月曜 9:00
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: '対象期間（日数）。空の場合は 7 日間。テストで「昨日からの差分」を見るなら 1 を指定'
        required: false
        default: '7'
        type: string

concurrency:
  group: eigyo-tracker-weekly
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: eigyo-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: eigyo-tracker/package-lock.json
      - run: npm ci
      - name: Generate weekly report
        run: npx tsx src/monthly-report.ts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_COMPANIES_DB_ID: ${{ secrets.NOTION_COMPANIES_DB_ID }}
          NOTION_REPORT_DB_ID: ${{ secrets.NOTION_REPORT_DB_ID }}
          NOTION_USER_ID: ${{ secrets.NOTION_USER_ID }}
          NOTION_NOTIFY_PAGE_ID: ${{ secrets.NOTION_NOTIFY_PAGE_ID }}
          REPORT_DAYS: ${{ inputs.days || '7' }}
