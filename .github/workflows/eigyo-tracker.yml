name: eigyo-tracker sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: eigyo-tracker
  cancel-in-progress: false

permissions:
  contents: write  # notion-schema-cache.json の自動 commit に必要

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: eigyo-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: eigyo-tracker/package-lock.json
      - run: npm ci
      - name: Schema drift check (Notion 側の削除/型変更を検知)
        # resolver で名前変更・新規追加は吸収。残るのは「壊れ系」のみ。
        run: npm run check:schema
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_COMPANIES_DB_ID: ${{ secrets.NOTION_COMPANIES_DB_ID }}
          NOTION_STATUS_CHANGE_LOG_DB_ID: ${{ secrets.NOTION_STATUS_CHANGE_LOG_DB_ID }}
      - name: Run sync
        run: npm run sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_COMPANIES_DB_ID: ${{ secrets.NOTION_COMPANIES_DB_ID }}
          NOTION_STATUS_CHANGE_LOG_DB_ID: ${{ secrets.NOTION_STATUS_CHANGE_LOG_DB_ID }}
          NOTION_USER_ID: ${{ secrets.NOTION_USER_ID }}
          NOTION_NOTIFY_PAGE_ID: ${{ secrets.NOTION_NOTIFY_PAGE_ID }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SYNC_LOOKBACK_DAYS: '2'
      - name: Auto-commit Notion schema cache & duplicate state (rename/追加/重複差分を git に反映)
        if: always()  # sync が落ちても cache 更新だけは反映したい
        working-directory: .
        run: |
          TARGETS="eigyo-tracker/notion-schema-cache.json eigyo-tracker/duplicate-state.json"
          if [[ -n "$(git status --porcelain $TARGETS)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $TARGETS
            git commit -m "chore(eigyo-tracker): notion-schema-cache / duplicate-state 自動更新"
            git pull --rebase origin main || true
            git push origin HEAD:main
          else
            echo "[auto-commit] cache/state に変更なし"
          fi
