name: inspect detection (debug)

on:
  workflow_dispatch:
    inputs:
      domains:
        description: '調査対象ドメインのカンマ区切り（例: recorc.com,to-inc.co.jp）'
        required: true
        type: string
      lookback_days:
        description: '何日前までのメールを見るか'
        required: false
        default: '14'
        type: string

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: eigyo-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: eigyo-tracker/package-lock.json
      - run: npm ci
      - name: Inspect
        run: npx tsx src/inspect-detection.ts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          TARGET_DOMAINS: ${{ inputs.domains }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
