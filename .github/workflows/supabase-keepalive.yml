name: supabase keep-alive

# Supabase 無料プランは 7 日間アクセスがないとプロジェクトが一時停止される。
# それを防ぐため、Supabase を使う各アプリの /api/keep-alive を週 2 回叩いて
# 軽い SELECT を発生させる。

on:
  schedule:
    # 毎週 月曜 / 木曜 0:00 UTC = JST 9:00
    - cron: '0 0 * * 1,4'
  workflow_dispatch:

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: travel-shiori
            url: https://tabinoshiori-swart.vercel.app/api/keep-alive
          - name: houmon-app
            url: https://houmon-app-lilac.vercel.app/api/keep-alive
          - name: nittei-chousei
            url: https://nittei-chousei-pi.vercel.app/api/keep-alive
    steps:
      - name: Ping ${{ matrix.target.name }}
        run: |
          set -e
          URL="${{ matrix.target.url }}"
          echo "Pinging $URL"
          HTTP_CODE=$(curl -sS -o /tmp/body.json -w "%{http_code}" "$URL")
          echo "HTTP $HTTP_CODE"
          cat /tmp/body.json
          echo
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::keep-alive failed for ${{ matrix.target.name }} with HTTP $HTTP_CODE"
            exit 1
          fi
