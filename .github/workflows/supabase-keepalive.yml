name: travel-shiori keep-alive

# Supabase 無料プランは 7 日間アクセスがないとプロジェクトが一時停止される。
# それを防ぐため、週 2 回 /api/keep-alive を叩いて Supabase に軽い SELECT を発生させる。

on:
  schedule:
    # 毎週 月曜 / 木曜 0:00 UTC = JST 9:00
    - cron: '0 0 * * 1,4'
  workflow_dispatch:

concurrency:
  group: travel-shiori-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping keep-alive endpoint
        run: |
          set -e
          URL="https://tabinoshiori-swart.vercel.app/api/keep-alive"
          echo "Pinging $URL"
          HTTP_CODE=$(curl -sS -o /tmp/body.json -w "%{http_code}" "$URL")
          echo "HTTP $HTTP_CODE"
          cat /tmp/body.json
          echo
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::keep-alive failed with HTTP $HTTP_CODE"
            exit 1
          fi
