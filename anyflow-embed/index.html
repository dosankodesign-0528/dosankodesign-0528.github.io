<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anyflow Embed — API連携でAIと事業を強くする</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #f3f3f3;
    font-family: 'Noto Sans JP', sans-serif;
    overflow-x: hidden;
  }

  /* ---- 1440x921 の固定ステージを画面幅に合わせてスケール ---- */
  .stage-wrap { width: 100%; overflow: hidden; }
  .stage {
    position: relative;
    width: 1440px;
    height: 921px;
    transform-origin: top left;
  }

  /* ---- Header ---- */
  .header {
    position: absolute;
    left: 38px;
    top: 26px;
    width: 1340px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header .logo img { width: 255px; height: 47px; display: block; }
  .nav { display: flex; align-items: center; gap: 32px; }
  .nav-links { display: flex; gap: 20px; align-items: center; }
  .nav-links a {
    font-weight: 300;
    font-size: 16px;
    color: #101828;
    text-decoration: none;
    white-space: nowrap;
    transition: opacity .25s;
  }
  .nav-links a:hover { opacity: .55; }
  .cta {
    background: #090909;
    color: #fff;
    font-weight: 300;
    font-size: 14px;
    width: 140px;
    padding: 10px 16px;
    border-radius: 4px;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: inherit;
    transition: opacity .25s;
  }
  .cta:hover { opacity: .78; }

  /* ---- Copy ---- */
  .headline {
    position: absolute;
    left: 109px;
    top: 210px;
    font-weight: 100;
    line-height: normal;
    color: #101828;
    white-space: nowrap;
    opacity: 0;
    transform: translateY(14px);
    filter: blur(6px);
    animation: reveal 1.2s ease .3s forwards;
  }
  .headline .hl-s { font-size: 50px; }
  .headline .hl-l { font-size: 80px; }
  @keyframes reveal {
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  /* ---- Orbit + Sphere ---- */
  .orbit {
    position: absolute;
    left: 496px;
    top: 179px;
    width: 915.483px;
    height: 630px;
    opacity: 0;
    animation: fadein 1.6s ease .15s forwards;
  }
  @keyframes fadein { to { opacity: 1; } }
  .orbit svg {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .orbit .layer-back  { z-index: 1; }
  .orbit .layer-front { z-index: 3; }
  #sphere {
    position: absolute;
    left: 306.06px;
    top: 112.32px;
    width: 260px;
    height: 260px;
    z-index: 2;
  }
  #sphere.fallback {
    background: url('assets/sphere.png') center / 230px 230px no-repeat;
  }

  /* ---- Logos (ティッカー風カルーセル) ---- */
  .logos {
    position: absolute;
    left: 0;
    top: 796px;
    width: 1440px;
    overflow: hidden;
    opacity: 0;
    animation: fadein 1.4s ease .6s forwards;
  }
  .marquee-track {
    display: flex;
    width: max-content;
    animation: marquee 30s linear infinite;
    will-change: transform;
  }
  .marquee-track img {
    height: 42px;
    width: auto;
    display: block;
    padding-right: 80px;
    box-sizing: content-box;
  }
  @keyframes marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* ---- パターン/惑星スイッチャー ---- */
  .switcher {
    position: fixed;
    left: 16px;
    bottom: 16px;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(12px);
    border: 1px solid #e2e2e2;
    border-radius: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,.10);
    font-size: 12px;
    color: #101828;
    z-index: 50;
    padding: 12px 14px;
    max-width: 460px;
  }
  .sw-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sw-row + .sw-row { margin-top: 8px; }
  .sw-label { flex: 0 0 44px; color: #555; font-weight: 300; }
  .sw-pill {
    font-family: inherit;
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid #d8d8d8;
    background: #fff;
    cursor: pointer;
    color: #333;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: background .2s, border-color .2s;
  }
  .sw-pill:hover { border-color: #999; }
  .sw-pill.on { background: #090909; color: #fff; border-color: #090909; }
  .sw-swatch { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.08); }
  .sw-desc { margin-top: 8px; color: #777; font-weight: 300; font-size: 11px; }

  /* ---- 調整パネル ---- */
  .panel {
    position: fixed;
    right: 16px;
    bottom: 16px;
    width: 300px;
    max-height: calc(100vh - 32px);
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(12px);
    border: 1px solid #e2e2e2;
    border-radius: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,.10);
    font-size: 12px;
    color: #101828;
    z-index: 50;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    cursor: pointer;
    user-select: none;
    font-weight: 400;
  }
  .panel-head .chev { transition: transform .25s; font-size: 10px; color: #888; }
  .panel.closed .chev { transform: rotate(180deg); }
  .panel-body {
    overflow-y: auto;
    padding: 0 14px 14px;
  }
  .panel.closed .panel-body { display: none; }
  .grp { margin-top: 10px; padding-top: 10px; border-top: 1px solid #ececec; }
  .grp-title { font-weight: 400; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .chip { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .row label { flex: 0 0 92px; color: #555; font-weight: 300; }
  .row input[type=range] { flex: 1; accent-color: #090909; min-width: 0; }
  .row .val { flex: 0 0 44px; text-align: right; font-variant-numeric: tabular-nums; color: #333; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  .btns button {
    flex: 1;
    font-family: inherit;
    font-size: 12px;
    padding: 7px 0;
    border-radius: 6px;
    border: 1px solid #d8d8d8;
    background: #fff;
    cursor: pointer;
    transition: background .2s;
  }
  .btns button:hover { background: #f2f2f2; }
  .btns button.primary { background: #090909; color: #fff; border-color: #090909; }
  .btns button.primary:hover { background: #333; }
  .seg { display: flex; border: 1px solid #d8d8d8; border-radius: 6px; overflow: hidden; flex: 1; }
  .seg button {
    flex: 1; border: none; background: #fff; font-family: inherit;
    font-size: 11px; padding: 5px 0; cursor: pointer; color: #555;
  }
  .seg button.on { background: #090909; color: #fff; }
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="stage" id="stage">

    <header class="header">
      <div class="logo"><img src="assets/header-logo.svg" alt="Anyflow Embed"></div>
      <nav class="nav">
        <div class="nav-links">
          <a href="#">ビジョン</a>
          <a href="#">提供できること</a>
          <a href="#">使用イメージ</a>
          <a href="#">導入事例</a>
        </div>
        <button class="cta">お問い合わせ</button>
      </nav>
    </header>

    <h1 class="headline">
      <span class="hl-s">API連携で</span><br>
      <span class="hl-l">AIと事業を</span><br>
      <span class="hl-l">強くする</span>
    </h1>

    <div class="orbit">
      <!-- 奥レイヤー: 軌道線の全周 + 奥側を通るドット (球体の裏に隠れる) -->
      <svg class="layer-back" viewBox="0 0 915.483 630" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gInnerB" x1="475.283" y1="217.363" x2="475.283" y2="483.647" gradientUnits="userSpaceOnUse">
            <stop stop-color="#00ABEB"/><stop offset="0.490385" stop-color="white"/><stop offset="1" stop-color="#FF5D97"/>
          </linearGradient>
          <linearGradient id="gOuterB" x1="457.741" y1="160.517" x2="457.741" y2="452.569" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FF5D97"/><stop offset="0.403846" stop-color="white"/><stop offset="1" stop-color="#00ABEB"/>
          </linearGradient>
        </defs>
        <ellipse cx="475.283" cy="350.505" rx="397.09" ry="133.142" transform="rotate(-23.3266 475.283 350.505)" stroke="url(#gInnerB)" stroke-width="3"/>
        <ellipse cx="457.741" cy="306.543" rx="435.517" ry="146.026" transform="rotate(-23.3266 457.741 306.543)" stroke="url(#gOuterB)" stroke-width="3"/>

      </svg>

      <!-- 球体 (WebGL) -->
      <canvas id="sphere" width="520" height="520"></canvas>

      <!-- 手前レイヤー: 軌道線の手前半分 + 手前側を通るドット (球体の上を横切る) -->
      <svg class="layer-front" viewBox="0 0 915.483 630" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gInnerF" x1="475.283" y1="217.363" x2="475.283" y2="483.647" gradientUnits="userSpaceOnUse">
            <stop stop-color="#00ABEB"/><stop offset="0.490385" stop-color="white"/><stop offset="1" stop-color="#FF5D97"/>
          </linearGradient>
          <linearGradient id="gOuterF" x1="457.741" y1="160.517" x2="457.741" y2="452.569" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FF5D97"/><stop offset="0.403846" stop-color="white"/><stop offset="1" stop-color="#00ABEB"/>
          </linearGradient>
          <clipPath id="clipInnerF">
            <rect x="-420" y="0" width="840" height="160" transform="translate(475.283 350.505) rotate(-23.3266)"/>
          </clipPath>
          <clipPath id="clipOuterF">
            <rect x="-458" y="0" width="916" height="172" transform="translate(457.741 306.543) rotate(-23.3266)"/>
          </clipPath>
        </defs>
        <g clip-path="url(#clipInnerF)">
          <ellipse cx="475.283" cy="350.505" rx="397.09" ry="133.142" transform="rotate(-23.3266 475.283 350.505)" stroke="url(#gInnerF)" stroke-width="3"/>
        </g>
        <g clip-path="url(#clipOuterF)">
          <ellipse cx="457.741" cy="306.543" rx="435.517" ry="146.026" transform="rotate(-23.3266 457.741 306.543)" stroke="url(#gOuterF)" stroke-width="3"/>
        </g>
        <g id="dotsFront"></g>
      </svg>
    </div>

    <div class="logos">
      <div class="marquee-track" id="marqueeTrack">
        <img src="assets/logos-strip.png" alt="導入企業ロゴ">
        <img src="assets/logos-strip.png" alt="" aria-hidden="true">
      </div>
    </div>

  </div>
</div>

<!-- ================= パターン/惑星スイッチャー ================= -->
<div class="switcher" id="switcher">
  <div class="sw-row" id="swPatterns"><span class="sw-label">アニメ</span></div>
  <div class="sw-row" id="swDesigns"><span class="sw-label">惑星</span></div>
  <div class="sw-desc" id="swDesc"></div>
</div>

<!-- ================= アニメ調整パネル ================= -->
<div class="panel" id="panel">
  <div class="panel-head" id="panelHead">
    <span>⚙️ アニメーション調整</span>
    <span class="chev">▲</span>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<script>
/* ================= 軌道データ (Figma カンプから抽出) ================= */
const ROT = -23.3266 * Math.PI / 180;
const ELLIPSES = {
  outer: { cx: 457.741, cy: 306.543, rx: 435.517, ry: 146.026 },
  inner: { cx: 475.283, cy: 350.505, rx: 397.09,  ry: 133.142 },
};
/* 各ドット: 所属楕円とカンプ上の初期角度 (楕円式から逆算) */
const DOTS = [
  { name: 'ネイビー',  color: '#0E4497', ellipse: 'outer', angle: 261.0 },
  { name: '水色 A',    color: '#0EBBFF', ellipse: 'inner', angle: 117.8 },
  { name: 'ピンク A',  color: '#FF5D97', ellipse: 'inner', angle: 192.0 },
  { name: 'グレー',    color: '#4E4E4E', ellipse: 'outer', angle: 67.3 },
  { name: 'ピンク B',  color: '#FF5D97', ellipse: 'inner', angle: 33.8 },
  { name: '水色 B',    color: '#0EBBFF', ellipse: 'inner', angle: 329.4 },
];
const DOT_R = 5.606;

/* ================= アニメパターン (5案) ================= */
const PATTERNS = [
  { name: '① スタンダード', desc: '緩急のゆらぎでゆったり進む（現行）。自転は多面ゆらぎ。' },
  { name: '② コメット', desc: '彗星みたいに、惑星のそばでグッと加速して離れるとゆったり。自転は少し速め。' },
  { name: '③ ドリフト', desc: '各ドットが気まぐれに漂う。止まりかけたり、すっと進んだり。自転は大きくうねる。' },
  { name: '④ すれ違い', desc: '内側と外側の軌道が逆回転して、ドット同士がすれ違う。自転はどっしりゆっくり。' },
  { name: '⑤ リズム', desc: 'コツン、コツンと一定のリズムで進む（データが流れるイメージ）。自転も同じリズムで刻む。' },
];

/* ================= 惑星デザイン (Figmaカンプ4種) ================= */
const norm = v => { const l = Math.hypot(...v); return v.map(x => x / l); };
const DESIGNS = {
  A: {
    name: 'A やわらかパステル',
    swatch: 'radial-gradient(circle at 30% 30%, #ffffff 15%, #ffb3d1 55%, #64d2f5 100%)',
    base: [0.99, 0.99, 1.0], hi: 0.62, grain: 0.02, scan: 0.035,
    layers: [
      { col: [1.0, 0.42, 0.63],  dir: norm([0.9, 0.1, 0.28]),    w: 0.9,  pow: 2.2 },
      { col: [0.96, 0.22, 0.55], dir: norm([0.9, 0.1, 0.28]),    w: 0.5,  pow: 6.0 },
      { col: [0.30, 0.80, 0.97], dir: norm([-0.62, -0.5, 0.35]), w: 0.9,  pow: 2.2 },
      { col: [0.42, 0.58, 0.95], dir: norm([0.2, -0.88, 0.25]),  w: 0.75, pow: 2.6 },
    ],
  },
  B: {
    name: 'B ビビッドブルー',
    swatch: 'linear-gradient(140deg, #ff5d97 5%, #ffffff 30%, #1e9bff 65%, #0b6bff 100%)',
    base: [0.10, 0.56, 0.97], hi: 0.4, grain: 0.11, scan: 0.015,
    layers: [
      { col: [1.0, 1.0, 1.0],    dir: norm([0.5, 0.72, 0.3]),   w: 2.2, pow: 1.6 },
      { col: [1.0, 0.28, 0.6],   dir: norm([-0.62, 0.55, 0.3]), w: 1.8, pow: 2.2 },
      { col: [0.03, 0.32, 0.9],  dir: norm([0.15, -0.9, 0.3]),  w: 0.75, pow: 2.0 },
      { col: [0.4, 0.8, 1.0],    dir: norm([0.75, -0.2, 0.4]),  w: 0.45, pow: 2.2 },
    ],
  },
  C: {
    name: 'C ピンク×ブルー',
    swatch: 'linear-gradient(160deg, #ff5d97 22%, #ffffff 50%, #26a9ff 78%)',
    base: [1.0, 1.0, 1.0], hi: 0.45, grain: 0.10, scan: 0.015,
    layers: [
      { col: [1.0, 0.25, 0.58],  dir: norm([-0.55, 0.6, 0.35]),  w: 1.6, pow: 1.8 },
      { col: [0.97, 0.14, 0.48], dir: norm([-0.68, 0.52, 0.3]),  w: 0.7, pow: 4.0 },
      { col: [0.10, 0.60, 0.98], dir: norm([-0.1, -0.85, 0.35]), w: 1.6, pow: 1.8 },
      { col: [0.55, 0.82, 1.0],  dir: norm([0.6, -0.4, 0.4]),    w: 0.45, pow: 2.4 },
    ],
  },
  D: {
    name: 'D ライトグレイン',
    swatch: 'linear-gradient(200deg, #9fdcff 12%, #ffffff 45%, #ff9ac4 88%)',
    base: [0.97, 0.985, 1.0], hi: 0.45, grain: 0.14, scan: 0.015,
    layers: [
      { col: [0.30, 0.68, 1.0],  dir: norm([0.6, 0.6, 0.35]),    w: 1.5,  pow: 1.9 },
      { col: [0.25, 0.5, 0.97],  dir: norm([0.8, 0.15, 0.35]),   w: 0.7,  pow: 3.0 },
      { col: [1.0, 0.45, 0.70],  dir: norm([-0.15, -0.82, 0.35]),w: 1.4,  pow: 2.1 },
      { col: [0.96, 0.3, 0.62],  dir: norm([0.25, -0.85, 0.3]),  w: 0.6,  pow: 3.5 },
    ],
  },
};

/* ================= 調整パラメーター ================= */
const DEFAULTS = {
  running: true,
  pattern: 1,        // アニメパターン 1〜5
  design: 'A',       // 惑星デザイン A〜D
  duration: 24,      // ドット1周の基準秒数
  globalSpeed: 1,    // 全体スピード倍率
  direction: 1,      // 1=時計回り / -1=反時計回り
  ramp: 1.5,         // 動き出しのなめらか加速(秒)
  pulse: {
    amp: 0.5,        // 緩急の強さ (0=一定速度, 1=一瞬止まるくらい)
    period: 8,       // 緩急の周期(秒)
  },
  sphere: {
    duration: 32,    // 球体1回転の秒数
    tumble: 0.37,    // 多面ゆらぎ (2軸目の回転比率)
    noise: 0.5,      // 質感の粒の強さ
  },
  marquee: {
    duration: 30,    // ロゴが1周する秒数
    direction: 1,    // 1=左へ / -1=右へ
  },
  dots: DOTS.map((_, i) => ({ speed: 1, delay: 0, offset: 0, pulsePhase: i * 60 })),
};
const STORAGE_KEY = 'anyflow-embed-anim-v3';

let params = load();
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (s && Array.isArray(s.dots) && s.dots.length === DOTS.length) {
      const merged = { ...structuredClone(DEFAULTS), ...s };
      merged.pulse = { ...DEFAULTS.pulse, ...(s.pulse || {}) };
      merged.sphere = { ...DEFAULTS.sphere, ...(s.sphere || {}) };
      merged.marquee = { ...DEFAULTS.marquee, ...(s.marquee || {}) };
      merged.dots = s.dots.map((d, i) => ({ ...DEFAULTS.dots[i], ...d }));
      return merged;
    }
  } catch (e) {}
  return structuredClone(DEFAULTS);
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(params)); }

/* ================= ドット要素 (奥/手前レイヤーに1個ずつ) ================= */
const SVG_NS = 'http://www.w3.org/2000/svg';
const dotsBackG = document.getElementById('dotsBack');
const dotsFrontG = document.getElementById('dotsFront');
const dotEls = DOTS.map(d => {
  const mk = () => {
    const c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('r', DOT_R);
    c.setAttribute('fill', d.color);
    return c;
  };
  const back = mk(), front = mk();
  dotsBackG.appendChild(back);
  dotsFrontG.appendChild(front);
  return { back, front };
});

function posOn(e, deg) {
  const t = deg * Math.PI / 180;
  const lx = e.rx * Math.cos(t), ly = e.ry * Math.sin(t);
  return {
    x: e.cx + lx * Math.cos(ROT) - ly * Math.sin(ROT),
    y: e.cy + lx * Math.sin(ROT) + ly * Math.cos(ROT),
    front: Math.sin(t) > 0,   // 楕円ローカルで下半分 = 手前側
  };
}

/* 遅延後になめらかに加速するための実効経過時間 */
function effectiveTime(t, delay, ramp) {
  const pt = t - delay;
  if (pt <= 0) return 0;
  if (ramp <= 0 || pt >= ramp) return pt - ramp / 2;
  return (pt * pt) / (2 * ramp);
}

/* 緩急: 速度 v(t) = 1 + amp*sin(2πt/period + φ) を積分した実効時間 */
function warpTime(t, amp, period, phaseDeg) {
  if (amp <= 0 || period <= 0) return t;
  const w = 2 * Math.PI / period;
  const ph = phaseDeg * Math.PI / 180;
  return t - (amp / w) * (Math.cos(w * t + ph) - Math.cos(ph));
}

let elapsed = 0;      // 再生中のみ進む累積時間
let lastTs = null;

/* ステップ&グライド: ph(周期単位) → コツンと進む累積量 */
function stepGlide(ph) {
  const k = Math.floor(ph), f = ph - k;
  const g = Math.min(1, f / 0.4);           // 周期の前半40%で移動、残りは静止
  const ease = g * g * (3 - 2 * g);
  return k + ease;
}

/* パターン別: ドットの現在角度(deg)を返す */
function patternDeg(d, i, p) {
  const base = 360 / params.duration * params.globalSpeed * params.direction;
  const et = effectiveTime(elapsed, p.delay, params.ramp);
  switch (params.pattern) {
    case 2: { /* コメット: 軌道上の位置で加減速 (惑星の裏側あたりで最速) */
      const lin = d.angle + p.offset + base * p.speed * et;
      return lin + 45 * Math.sin((lin - 270) * Math.PI / 180);
    }
    case 3: { /* ドリフト: 周期の違うサイン波を重ねた気まぐれな漂い */
      const a = 0.4 + params.pulse.amp;
      const n = (2.2 * Math.sin(0.23 * et + i * 2.7)
               + 1.3 * Math.sin(0.53 * et + i * 1.9)
               + 0.7 * Math.sin(1.13 * et + i * 5.1)) * a * 0.45;
      return d.angle + p.offset + base * p.speed * (et + n);
    }
    case 4: { /* すれ違い: 内側の軌道だけ逆回転 */
      const dir = d.ellipse === 'inner' ? -1 : 1;
      return d.angle + p.offset + base * p.speed * dir * et * (0.85 + 0.06 * i);
    }
    case 5: { /* リズム: 45°ずつコツンと進む (ドットごとに少し時間差) */
      const period = params.duration / 8 / params.globalSpeed;
      const ph = et / period + i * 0.37;
      return d.angle + p.offset + params.direction * 45 * stepGlide(ph);
    }
    default: { /* スタンダード: 緩急ゆらぎ */
      const wt = warpTime(et, params.pulse.amp, params.pulse.period, p.pulsePhase);
      return d.angle + p.offset + base * p.speed * wt;
    }
  }
}

function renderFrame() {
  DOTS.forEach((d, i) => {
    const p = params.dots[i];
    const deg = patternDeg(d, i, p);
    const pos = posOn(ELLIPSES[d.ellipse], deg);
    const els = dotEls[i];
    [els.back, els.front].forEach(el => {
      el.setAttribute('cx', pos.x);
      el.setAttribute('cy', pos.y);
    });
    els.front.style.display = pos.front ? '' : 'none';
    els.back.style.display = pos.front ? 'none' : '';
  });
  renderSphere();
}

/* ================= 球体 (WebGL / 2Dグラデを3D回転) ================= */
const sphereCanvas = document.getElementById('sphere');
let sphereGL = null;

function initSphere() {
  const gl = sphereCanvas.getContext('webgl', { alpha: true, antialias: true, premultipliedAlpha: true });
  if (!gl) { sphereCanvas.classList.add('fallback'); return; }

  const vs = `attribute vec2 aPos; void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;
  const fs = `
precision highp float;
uniform vec2 uRes;
uniform float uAngle;   /* 主回転 (rad) */
uniform float uAngle2;  /* 2軸目の回転 (rad) */
uniform float uDrift;   /* 質感のゆっくりした流れ */
uniform float uNoise;   /* 質感の粒の強さ */
uniform vec3 uBase;     /* ベース色 */
uniform vec3 uCol[4];   /* 色レイヤー */
uniform vec3 uDir[4];   /* 各レイヤーの方向 (正規化済み) */
uniform vec4 uW;        /* 各レイヤーの強さ */
uniform vec4 uPow;      /* 各レイヤーの集中度 */
uniform float uGrain;   /* 粒子ノイズ量 */
uniform float uScan;    /* 横縞ノイズ量 */
uniform float uHi;      /* ハイライトの強さ */

mat3 rotAxis(vec3 a, float t){
  float c = cos(t), s = sin(t);
  vec3 u = normalize(a);
  return mat3(
    c+u.x*u.x*(1.-c),      u.x*u.y*(1.-c)-u.z*s,  u.x*u.z*(1.-c)+u.y*s,
    u.y*u.x*(1.-c)+u.z*s,  c+u.y*u.y*(1.-c),      u.y*u.z*(1.-c)-u.x*s,
    u.z*u.x*(1.-c)-u.y*s,  u.z*u.y*(1.-c)+u.x*s,  c+u.z*u.z*(1.-c)
  );
}
float hash(vec3 p){
  p = fract(p * vec3(127.1, 311.7, 74.7));
  p += dot(p, p.yzx + 19.19);
  return fract((p.x + p.y) * p.z);
}
float vnoise(vec3 p){
  vec3 i = floor(p), f = fract(p);
  vec3 u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(mix(hash(i), hash(i+vec3(1,0,0)), u.x),
        mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), u.x), u.y),
    mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), u.x),
        mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), u.x), u.y), u.z);
}
float fbm(vec3 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 3; i++) { v += a * vnoise(p); p *= 2.03; a *= 0.5; }
  return v;
}
void main(){
  vec2 p = (gl_FragCoord.xy * 2.0 - uRes) / uRes.y;
  float R = 0.884615; /* 230px / 260px */
  float len = length(p);
  float px = 2.0 / uRes.y;
  float alpha = 1.0 - smoothstep(R - 1.5 * px, R + 1.5 * px, len);
  if (alpha <= 0.0) { gl_FragColor = vec4(0.0); return; }
  float z = sqrt(max(R * R - dot(p, p), 1e-5));
  vec3 n = normalize(vec3(p, z));

  /* 回転軸: 軌道の傾き(-23°)とはずらした斜め軸 + ゆっくり別軸 → 多面的 */
  vec3 ax1 = normalize(vec3(0.53, 0.85, 0.35));
  vec3 ax2 = normalize(vec3(-0.62, 0.22, 0.76));
  vec3 d = rotAxis(ax2, uAngle2) * rotAxis(ax1, uAngle) * n;

  float f = fbm(d * 2.4 + vec3(0.0, 0.0, uDrift));
  float g = fbm(d * 5.0 - vec3(uDrift * 0.7));

  /* abs() で球の表裏両方に色帯を出す → どの回転位相でもブランド色が残る */
  vec3 col = uBase;
  for (int i = 0; i < 4; i++) {
    float pw = i == 0 ? uPow.x : i == 1 ? uPow.y : i == 2 ? uPow.z : uPow.w;
    float st = i == 0 ? uW.x : i == 1 ? uW.y : i == 2 ? uW.z : uW.w;
    float fn = i == 2 ? g : f;
    float w = pow(abs(dot(d, uDir[i])), pw) * (0.7 + uNoise * (fn - 0.5) * 1.6);
    col = mix(col, uCol[i], clamp(w * st, 0.0, 1.0));
  }

  /* 光の当たり方はカンプ通り固定 (左上ハイライト) */
  float hi = pow(max(dot(n, normalize(vec3(-0.48, 0.62, 0.62))), 0.0), 1.7);
  col = mix(col, vec3(1.0), hi * uHi);
  float rim = pow(1.0 - n.z, 1.8);
  col *= 1.0 - rim * 0.05;

  /* 質感ノイズ: 粒子 + 細かい横縞 (「質感の粒」スライダーで増減) */
  float amt = 0.3 + uNoise * 1.4;
  float sp = (hash(vec3(floor(gl_FragCoord.x * 0.9), floor(gl_FragCoord.y * 0.9), 5.3)) - 0.5) * uGrain;
  float scan = (hash(vec3(floor(gl_FragCoord.y), 7.7, 3.1)) - 0.5) * uScan;
  col += (sp + scan) * amt;

  gl_FragColor = vec4(col * alpha, alpha);
}`;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(sh));
      return null;
    }
    return sh;
  }
  const v = compile(gl.VERTEX_SHADER, vs);
  const f = compile(gl.FRAGMENT_SHADER, fs);
  if (!v || !f) { sphereCanvas.classList.add('fallback'); return; }
  const prog = gl.createProgram();
  gl.attachShader(prog, v);
  gl.attachShader(prog, f);
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const dpr = Math.min(2, window.devicePixelRatio || 1);
  sphereCanvas.width = 260 * dpr;
  sphereCanvas.height = 260 * dpr;
  gl.viewport(0, 0, sphereCanvas.width, sphereCanvas.height);

  sphereGL = {
    gl,
    uRes: gl.getUniformLocation(prog, 'uRes'),
    uAngle: gl.getUniformLocation(prog, 'uAngle'),
    uAngle2: gl.getUniformLocation(prog, 'uAngle2'),
    uDrift: gl.getUniformLocation(prog, 'uDrift'),
    uNoise: gl.getUniformLocation(prog, 'uNoise'),
    uBase: gl.getUniformLocation(prog, 'uBase'),
    uCol: gl.getUniformLocation(prog, 'uCol'),
    uDir: gl.getUniformLocation(prog, 'uDir'),
    uW: gl.getUniformLocation(prog, 'uW'),
    uPow: gl.getUniformLocation(prog, 'uPow'),
    uGrain: gl.getUniformLocation(prog, 'uGrain'),
    uScan: gl.getUniformLocation(prog, 'uScan'),
    uHi: gl.getUniformLocation(prog, 'uHi'),
  };
  gl.uniform2f(sphereGL.uRes, sphereCanvas.width, sphereCanvas.height);
}

/* パターン別: 球体の回転角 (主回転, 2軸目) */
function sphereAngles() {
  const sp = params.sphere;
  switch (params.pattern) {
    case 2: { const a = 2 * Math.PI * elapsed / (sp.duration * 0.75); return [a, a * sp.tumble]; }
    case 3: { const a = 2 * Math.PI * elapsed / (sp.duration * 1.3); return [a, a * Math.max(0.8, sp.tumble)]; }
    case 4: { const a = 2 * Math.PI * elapsed / (sp.duration * 1.5); return [a, a * sp.tumble * 0.4]; }
    case 5: { /* ドットと同じリズムで刻む */
      const period = params.duration / 8 / params.globalSpeed;
      const a = 2 * Math.PI / 8 * stepGlide(elapsed / period) * (sp.duration ? 32 / sp.duration : 1);
      return [a, a * sp.tumble];
    }
    default: { const a = 2 * Math.PI * elapsed / sp.duration; return [a, a * sp.tumble]; }
  }
}

function renderSphere() {
  if (!sphereGL) return;
  const { gl } = sphereGL;
  const ds = DESIGNS[params.design] || DESIGNS.A;
  const [ang, ang2] = sphereAngles();
  gl.uniform1f(sphereGL.uAngle, ang);
  gl.uniform1f(sphereGL.uAngle2, ang2);
  gl.uniform1f(sphereGL.uDrift, elapsed * 0.02);
  gl.uniform1f(sphereGL.uNoise, params.sphere.noise);
  gl.uniform3fv(sphereGL.uBase, ds.base);
  gl.uniform3fv(sphereGL.uCol, ds.layers.flatMap(l => l.col));
  gl.uniform3fv(sphereGL.uDir, ds.layers.flatMap(l => l.dir));
  gl.uniform4fv(sphereGL.uW, ds.layers.map(l => l.w));
  gl.uniform4fv(sphereGL.uPow, ds.layers.map(l => l.pow));
  gl.uniform1f(sphereGL.uGrain, ds.grain);
  gl.uniform1f(sphereGL.uScan, ds.scan);
  gl.uniform1f(sphereGL.uHi, ds.hi);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
initSphere();

/* ロゴカルーセルへパラメーターを反映 */
const marqueeTrack = document.getElementById('marqueeTrack');
function applyMarquee() {
  marqueeTrack.style.animationDuration = params.marquee.duration + 's';
  marqueeTrack.style.animationDirection = params.marquee.direction === 1 ? 'normal' : 'reverse';
  marqueeTrack.style.animationPlayState = params.running ? 'running' : 'paused';
}

function frame(ts) {
  if (lastTs !== null && params.running) {
    elapsed += Math.min(0.1, (ts - lastTs) / 1000);
  }
  lastTs = ts;
  renderFrame();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
renderFrame();

/* デバッグ用フック（rAFが動かない環境で手動で時間を進める） */
window.__anim = {
  step(dt) { elapsed += dt; renderFrame(); },
  setElapsed(v) { elapsed = v; renderFrame(); },
  setPattern(n) { params.pattern = n; renderFrame(); },
  setDesign(k) { params.design = k; renderFrame(); },
  getState() { return { elapsed, params }; },
};

/* ================= ステージのスケーリング ================= */
const stage = document.getElementById('stage');
function fit() {
  const s = Math.min(1, window.innerWidth / 1440);
  stage.style.transform = `scale(${s})`;
  stage.parentElement.style.height = (921 * s) + 'px';
}
window.addEventListener('resize', fit);
fit();

/* ================= 調整パネル UI ================= */
const body = document.getElementById('panelBody');

function slider(label, min, max, step, get, set, fmt) {
  const row = document.createElement('div');
  row.className = 'row';
  const lab = document.createElement('label');
  lab.textContent = label;
  const input = document.createElement('input');
  input.type = 'range';
  input.min = min; input.max = max; input.step = step;
  input.value = get();
  const val = document.createElement('span');
  val.className = 'val';
  const f = fmt || (v => v);
  val.textContent = f(get());
  input.addEventListener('input', () => {
    set(parseFloat(input.value));
    val.textContent = f(parseFloat(input.value));
    save();
  });
  row.append(lab, input, val);
  row._sync = () => { input.value = get(); val.textContent = f(get()); };
  body.appendChild(row);
  return row;
}

const rows = [];

function buildPanel() {
  body.innerHTML = '';
  rows.length = 0;

  /* 全体 */
  const g = document.createElement('div');
  g.className = 'grp'; g.style.borderTop = 'none'; g.style.marginTop = '4px';
  g.innerHTML = '<div class="grp-title">全体</div>';
  body.appendChild(g);
  rows.push(slider('1周の秒数', 4, 80, 1, () => params.duration, v => params.duration = v, v => v + 's'));
  rows.push(slider('スピード倍率', 0.1, 3, 0.05, () => params.globalSpeed, v => params.globalSpeed = v, v => '×' + v.toFixed(2)));
  rows.push(slider('なめらか加速', 0, 5, 0.1, () => params.ramp, v => params.ramp = v, v => v.toFixed(1) + 's'));

  /* 球体 */
  const gs = document.createElement('div');
  gs.className = 'grp';
  gs.innerHTML = '<div class="grp-title">球体<span style="color:#999;font-weight:300">（3D回転）</span></div>';
  body.appendChild(gs);
  rows.push(slider('1回転の秒数', 8, 120, 1, () => params.sphere.duration, v => params.sphere.duration = v, v => v + 's'));
  rows.push(slider('多面ゆらぎ', 0, 1, 0.01, () => params.sphere.tumble, v => params.sphere.tumble = v, v => Math.round(v * 100) + '%'));
  rows.push(slider('質感の粒', 0, 1, 0.05, () => params.sphere.noise, v => params.sphere.noise = v, v => Math.round(v * 100) + '%'));

  /* 緩急 (速くなったり遅くなったり) */
  const gp = document.createElement('div');
  gp.className = 'grp';
  gp.innerHTML = '<div class="grp-title">緩急<span style="color:#999;font-weight:300">（速い⇄遅いのゆらぎ）</span></div>';
  body.appendChild(gp);
  rows.push(slider('強さ', 0, 1, 0.05, () => params.pulse.amp, v => params.pulse.amp = v, v => Math.round(v * 100) + '%'));
  rows.push(slider('周期', 1, 20, 0.5, () => params.pulse.period, v => params.pulse.period = v, v => v.toFixed(1) + 's'));

  const dirRow = document.createElement('div');
  dirRow.className = 'row';
  dirRow.innerHTML = '<label>回転方向</label>';
  const seg = document.createElement('div');
  seg.className = 'seg';
  const b1 = document.createElement('button'); b1.textContent = '時計回り';
  const b2 = document.createElement('button'); b2.textContent = '反時計回り';
  function syncDir() {
    b1.classList.toggle('on', params.direction === 1);
    b2.classList.toggle('on', params.direction === -1);
  }
  b1.onclick = () => { params.direction = 1; syncDir(); save(); };
  b2.onclick = () => { params.direction = -1; syncDir(); save(); };
  syncDir();
  seg.append(b1, b2);
  dirRow.appendChild(seg);
  body.appendChild(dirRow);

  /* 各ドット */
  DOTS.forEach((d, i) => {
    const grp = document.createElement('div');
    grp.className = 'grp';
    grp.innerHTML = `<div class="grp-title"><span class="chip" style="background:${d.color}"></span>${d.name}<span style="color:#999;font-weight:300">（${d.ellipse === 'outer' ? '外側' : '内側'}）</span></div>`;
    body.appendChild(grp);
    rows.push(slider('スピード倍率', 0, 3, 0.05, () => params.dots[i].speed, v => params.dots[i].speed = v, v => '×' + v.toFixed(2)));
    rows.push(slider('遅延', 0, 10, 0.1, () => params.dots[i].delay, v => params.dots[i].delay = v, v => v.toFixed(1) + 's'));
    rows.push(slider('開始位置', -180, 180, 1, () => params.dots[i].offset, v => params.dots[i].offset = v, v => v + '°'));
    rows.push(slider('緩急ずらし', 0, 360, 5, () => params.dots[i].pulsePhase, v => params.dots[i].pulsePhase = v, v => v + '°'));
  });

  /* ロゴカルーセル */
  const gm = document.createElement('div');
  gm.className = 'grp';
  gm.innerHTML = '<div class="grp-title">ロゴカルーセル</div>';
  body.appendChild(gm);
  rows.push(slider('1周の秒数', 5, 120, 1, () => params.marquee.duration, v => { params.marquee.duration = v; applyMarquee(); }, v => v + 's'));

  const mDirRow = document.createElement('div');
  mDirRow.className = 'row';
  mDirRow.innerHTML = '<label>流れる方向</label>';
  const mSeg = document.createElement('div');
  mSeg.className = 'seg';
  const m1 = document.createElement('button'); m1.textContent = '← 左へ';
  const m2 = document.createElement('button'); m2.textContent = '右へ →';
  function syncMDir() {
    m1.classList.toggle('on', params.marquee.direction === 1);
    m2.classList.toggle('on', params.marquee.direction === -1);
  }
  m1.onclick = () => { params.marquee.direction = 1; syncMDir(); applyMarquee(); save(); };
  m2.onclick = () => { params.marquee.direction = -1; syncMDir(); applyMarquee(); save(); };
  syncMDir();
  mSeg.append(m1, m2);
  mDirRow.appendChild(mSeg);
  body.appendChild(mDirRow);

  /* ボタン */
  const btns = document.createElement('div');
  btns.className = 'btns';
  const playBtn = document.createElement('button');
  playBtn.className = 'primary';
  function syncPlay() { playBtn.textContent = params.running ? '⏸ 一時停止' : '▶ 再生'; }
  playBtn.onclick = () => { params.running = !params.running; syncPlay(); applyMarquee(); save(); };
  syncPlay();
  const restartBtn = document.createElement('button');
  restartBtn.textContent = '↺ 最初から';
  restartBtn.onclick = () => { elapsed = 0; };
  const resetBtn = document.createElement('button');
  resetBtn.textContent = '初期値に戻す';
  resetBtn.onclick = () => {
    params = structuredClone(DEFAULTS);
    elapsed = 0;
    save();
    buildPanel();
    buildSwitcher();
    applyMarquee();
  };
  btns.append(playBtn, restartBtn, resetBtn);
  body.appendChild(btns);
}
buildPanel();
applyMarquee();

/* ================= パターン/惑星スイッチャー ================= */
function buildSwitcher() {
  const pRow = document.getElementById('swPatterns');
  const dRow = document.getElementById('swDesigns');
  const desc = document.getElementById('swDesc');
  pRow.querySelectorAll('.sw-pill').forEach(el => el.remove());
  dRow.querySelectorAll('.sw-pill').forEach(el => el.remove());

  function syncDesc() {
    desc.textContent = PATTERNS[params.pattern - 1].desc;
  }
  PATTERNS.forEach((pt, i) => {
    const b = document.createElement('button');
    b.className = 'sw-pill';
    b.textContent = pt.name;
    const sync = () => b.classList.toggle('on', params.pattern === i + 1);
    b.onclick = () => {
      params.pattern = i + 1;
      pRow.querySelectorAll('.sw-pill').forEach((el, j) => el.classList.toggle('on', params.pattern === j + 1));
      syncDesc();
      save();
    };
    sync();
    pRow.appendChild(b);
  });
  Object.entries(DESIGNS).forEach(([key, ds]) => {
    const b = document.createElement('button');
    b.className = 'sw-pill';
    const sw = document.createElement('span');
    sw.className = 'sw-swatch';
    sw.style.background = ds.swatch;
    b.append(sw, document.createTextNode(ds.name));
    const sync = () => b.classList.toggle('on', params.design === key);
    b.onclick = () => {
      params.design = key;
      dRow.querySelectorAll('.sw-pill').forEach(el => el.classList.remove('on'));
      b.classList.add('on');
      save();
    };
    sync();
    dRow.appendChild(b);
  });
  syncDesc();
}
buildSwitcher();

/* パネル開閉 */
const panel = document.getElementById('panel');
document.getElementById('panelHead').addEventListener('click', () => {
  panel.classList.toggle('closed');
});
</script>
