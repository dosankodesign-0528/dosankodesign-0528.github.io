<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anyflow Embed — API連携でAIと事業を強くする</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #f3f3f3;
    font-family: 'Noto Sans JP', sans-serif;
    overflow-x: hidden;
  }

  /* ---- 1440x921 の固定ステージを画面幅に合わせてスケール ---- */
  .stage-wrap { width: 100%; overflow: hidden; }
  .stage {
    position: relative;
    width: 1440px;
    height: 921px;
    transform-origin: top left;
  }

  /* ---- Header ---- */
  .header {
    position: absolute;
    left: 38px;
    top: 26px;
    width: 1340px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header .logo img { width: 255px; height: 47px; display: block; }
  .nav { display: flex; align-items: center; gap: 32px; }
  .nav-links { display: flex; gap: 20px; align-items: center; }
  .nav-links a {
    font-weight: 300;
    font-size: 16px;
    color: #101828;
    text-decoration: none;
    white-space: nowrap;
    transition: opacity .25s;
  }
  .nav-links a:hover { opacity: .55; }
  .cta {
    background: #090909;
    color: #fff;
    font-weight: 300;
    font-size: 14px;
    width: 140px;
    padding: 10px 16px;
    border-radius: 4px;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: inherit;
    transition: opacity .25s;
  }
  .cta:hover { opacity: .78; }

  /* ---- Copy ---- */
  .headline {
    position: absolute;
    left: 109px;
    top: 210px;
    font-weight: 100;
    line-height: normal;
    color: #101828;
    white-space: nowrap;
    opacity: 0;
    transform: translateY(14px);
    filter: blur(6px);
    animation: reveal 1.2s ease .3s forwards;
  }
  .headline .hl-s { font-size: 50px; }
  .headline .hl-l { font-size: 80px; }
  @keyframes reveal {
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  /* ---- Orbit + Sphere ---- */
  .orbit {
    position: absolute;
    left: 496px;
    top: 179px;
    width: 915.483px;
    height: 630px;
    opacity: 0;
    animation: fadein 1.6s ease .15s forwards;
  }
  @keyframes fadein { to { opacity: 1; } }
  .orbit { transform-origin: 50% 50%; }
  .orbit svg {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    transform-origin: 50% 50%;
  }
  #sphere { transform-origin: 50% 50%; }
  .orbit .layer-back  { z-index: 1; }
  .orbit .layer-front { z-index: 3; }
  #sphere {
    position: absolute;
    left: 306.06px;
    top: 112.32px;
    width: 260px;
    height: 260px;
    z-index: 2;
  }
  #sphere.fallback {
    background-size: 230px 230px;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* ---- Logos (ティッカー風カルーセル) ---- */
  .logos {
    position: absolute;
    left: 0;
    top: 796px;
    width: 1440px;
    overflow: hidden;
    opacity: 0;
    animation: fadein 1.4s ease .6s forwards;
  }
  .marquee-track {
    display: flex;
    width: max-content;
    animation: marquee 30s linear infinite;
    will-change: transform;
  }
  .marquee-track img {
    height: 42px;
    width: auto;
    display: block;
    padding-right: 80px;
    box-sizing: content-box;
  }
  @keyframes marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* ---- パターン/惑星スイッチャー ---- */
  .switcher {
    position: fixed;
    left: 16px;
    bottom: 16px;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(12px);
    border: 1px solid #e2e2e2;
    border-radius: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,.10);
    font-size: 12px;
    color: #101828;
    z-index: 50;
    padding: 12px 14px;
    max-width: 460px;
  }
  .sw-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sw-row + .sw-row { margin-top: 8px; }
  .sw-label { flex: 0 0 44px; color: #555; font-weight: 300; }
  .sw-pill {
    font-family: inherit;
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid #d8d8d8;
    background: #fff;
    cursor: pointer;
    color: #333;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: background .2s, border-color .2s;
  }
  .sw-pill:hover { border-color: #999; }
  .sw-pill.on { background: #090909; color: #fff; border-color: #090909; }
  .sw-swatch { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.08); }
  .sw-desc { margin-top: 8px; color: #777; font-weight: 300; font-size: 11px; }

  /* ---- 調整パネル ---- */
  .panel {
    position: fixed;
    right: 16px;
    bottom: 16px;
    width: 300px;
    max-height: calc(100vh - 32px);
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(12px);
    border: 1px solid #e2e2e2;
    border-radius: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,.10);
    font-size: 12px;
    color: #101828;
    z-index: 50;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    cursor: pointer;
    user-select: none;
    font-weight: 400;
  }
  .panel-head .chev { transition: transform .25s; font-size: 10px; color: #888; }
  .panel.closed .chev { transform: rotate(180deg); }
  .panel-body {
    overflow-y: auto;
    padding: 0 14px 14px;
  }
  .panel.closed .panel-body { display: none; }
  /* 大カテゴリ (アコーディオン) */
  .cat {
    border: 1px solid #e8e8e8;
    border-radius: 8px;
    margin-top: 10px;
    overflow: hidden;
    background: #fff;
  }
  .cat-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 12px;
    font-weight: 500;
    background: #fafafa;
    cursor: pointer;
    user-select: none;
  }
  .cat-head:hover { background: #f2f2f2; }
  .cat-chev { font-size: 10px; color: #888; transition: transform .2s; }
  .cat.closed .cat-chev { transform: rotate(-90deg); }
  .cat-body { padding: 0 12px 12px; }
  .cat.closed .cat-body { display: none; }
  .grp { margin-top: 10px; padding-top: 10px; border-top: 1px solid #ececec; }
  .cat-body .grp:first-child { border-top: none; margin-top: 6px; }
  .grp-title { font-weight: 400; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .chip { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .row label { flex: 0 0 92px; color: #555; font-weight: 300; }
  .row input[type=range] { flex: 1; accent-color: #090909; min-width: 0; }
  .row .val { flex: 0 0 44px; text-align: right; font-variant-numeric: tabular-nums; color: #333; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  .btns button {
    flex: 1;
    font-family: inherit;
    font-size: 12px;
    padding: 7px 0;
    border-radius: 6px;
    border: 1px solid #d8d8d8;
    background: #fff;
    cursor: pointer;
    transition: background .2s;
  }
  .btns button:hover { background: #f2f2f2; }
  .btns button.primary { background: #090909; color: #fff; border-color: #090909; }
  .btns button.primary:hover { background: #333; }
  .seg { display: flex; border: 1px solid #d8d8d8; border-radius: 6px; overflow: hidden; flex: 1; }
  .seg button {
    flex: 1; border: none; background: #fff; font-family: inherit;
    font-size: 11px; padding: 5px 0; cursor: pointer; color: #555;
  }
  .seg button.on { background: #090909; color: #fff; }
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="stage" id="stage">

    <header class="header">
      <div class="logo"><img src="assets/header-logo.svg" alt="Anyflow Embed"></div>
      <nav class="nav">
        <div class="nav-links">
          <a href="#">ビジョン</a>
          <a href="#">提供できること</a>
          <a href="#">使用イメージ</a>
          <a href="#">導入事例</a>
        </div>
        <button class="cta">お問い合わせ</button>
      </nav>
    </header>

    <h1 class="headline">
      <span class="hl-s">API連携で</span><br>
      <span class="hl-l">AIと事業を</span><br>
      <span class="hl-l">強くする</span>
    </h1>

    <div class="orbit">
      <!-- 奥レイヤー: 軌道線の全周 + 奥側を通るドット (球体の裏に隠れる) -->
      <svg class="layer-back" viewBox="0 0 915.483 630" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gInnerB" x1="475.283" y1="217.363" x2="475.283" y2="483.647" gradientUnits="userSpaceOnUse">
            <stop stop-color="#00ABEB"/><stop offset="0.490385" stop-color="white"/><stop offset="1" stop-color="#FF5D97"/>
          </linearGradient>
          <linearGradient id="gOuterB" x1="457.741" y1="160.517" x2="457.741" y2="452.569" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FF5D97"/><stop offset="0.403846" stop-color="white"/><stop offset="1" stop-color="#00ABEB"/>
          </linearGradient>
        </defs>
        <ellipse id="ellInnerB" cx="475.283" cy="350.505" rx="397.09" ry="133.142" transform="rotate(-23.3266 475.283 350.505)" stroke="url(#gInnerB)" stroke-width="3"/>
        <ellipse id="ellOuterB" cx="457.741" cy="306.543" rx="435.517" ry="146.026" transform="rotate(-23.3266 457.741 306.543)" stroke="url(#gOuterB)" stroke-width="3"/>
        <g id="dotsBack"></g>
      </svg>

      <!-- 球体 (WebGL) -->
      <canvas id="sphere" width="520" height="520"></canvas>

      <!-- 手前レイヤー: 軌道線の手前半分 + 手前側を通るドット (球体の上を横切る) -->
      <svg class="layer-front" viewBox="0 0 915.483 630" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gInnerF" x1="475.283" y1="217.363" x2="475.283" y2="483.647" gradientUnits="userSpaceOnUse">
            <stop stop-color="#00ABEB"/><stop offset="0.490385" stop-color="white"/><stop offset="1" stop-color="#FF5D97"/>
          </linearGradient>
          <linearGradient id="gOuterF" x1="457.741" y1="160.517" x2="457.741" y2="452.569" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FF5D97"/><stop offset="0.403846" stop-color="white"/><stop offset="1" stop-color="#00ABEB"/>
          </linearGradient>
          <clipPath id="clipInnerF">
            <rect id="clipInnerRect" x="-420" y="0" width="840" height="160" transform="translate(475.283 350.505) rotate(-23.3266)"/>
          </clipPath>
          <clipPath id="clipOuterF">
            <rect id="clipOuterRect" x="-458" y="0" width="916" height="172" transform="translate(457.741 306.543) rotate(-23.3266)"/>
          </clipPath>
        </defs>
        <g clip-path="url(#clipInnerF)">
          <ellipse id="ellInnerF" cx="475.283" cy="350.505" rx="397.09" ry="133.142" transform="rotate(-23.3266 475.283 350.505)" stroke="url(#gInnerF)" stroke-width="3"/>
        </g>
        <g clip-path="url(#clipOuterF)">
          <ellipse id="ellOuterF" cx="457.741" cy="306.543" rx="435.517" ry="146.026" transform="rotate(-23.3266 457.741 306.543)" stroke="url(#gOuterF)" stroke-width="3"/>
        </g>
        <g id="dotsFront"></g>
      </svg>
    </div>

    <div class="logos">
      <div class="marquee-track" id="marqueeTrack">
        <img src="assets/logos-strip.png" alt="導入企業ロゴ">
        <img src="assets/logos-strip.png" alt="" aria-hidden="true">
      </div>
    </div>

  </div>
</div>

<!-- ================= パターン/惑星スイッチャー ================= -->
<div class="switcher" id="switcher">
  <div class="sw-row" id="swPatterns"><span class="sw-label">アニメ</span></div>
  <div class="sw-row" id="swSways"><span class="sw-label">ゆらぎ</span></div>
  <div class="sw-row" id="swDesigns"><span class="sw-label">惑星</span></div>
  <div class="sw-row" id="swDithers" style="display:none"><span class="sw-label">ディザ</span></div>
  <div class="sw-desc" id="swDesc"></div>
</div>

<!-- ================= アニメ調整パネル ================= -->
<div class="panel" id="panel">
  <div class="panel-head" id="panelHead">
    <span>⚙️ アニメーション調整</span>
    <span class="chev">▲</span>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<script>
/* ================= 軌道データ (Figma カンプから抽出) ================= */
const ROTDEG = -23.3266;
const ELLIPSES = {
  outer: { cx: 457.741, cy: 306.543, rx: 435.517, ry: 146.026 },
  inner: { cx: 475.283, cy: 350.505, rx: 397.09,  ry: 133.142 },
};
/* 各ドット: 所属楕円とカンプ上の初期角度 (楕円式から逆算) */
const DOTS = [
  { name: 'ネイビー',  color: '#0E4497', ellipse: 'outer', angle: 261.0 },
  { name: '水色 A',    color: '#0EBBFF', ellipse: 'inner', angle: 117.8 },
  { name: 'ピンク A',  color: '#FF5D97', ellipse: 'inner', angle: 192.0 },
  { name: 'グレー',    color: '#4E4E4E', ellipse: 'outer', angle: 67.3 },
  { name: 'ピンク B',  color: '#FF5D97', ellipse: 'inner', angle: 33.8 },
  { name: '水色 B',    color: '#0EBBFF', ellipse: 'inner', angle: 329.4 },
];
const DOT_R = 5.606;

/* ================= アニメパターン (5案) ================= */
const PATTERNS = [
  { name: '① スタンダード', desc: '緩急のゆらぎでゆったり進む（現行）。自転は多面ゆらぎ。' },
  { name: '② コメット', desc: '彗星みたいに、惑星のそばでグッと加速して離れるとゆったり。自転は少し速め。' },
  { name: '③ ドリフト', desc: '各ドットが気まぐれに漂う。止まりかけたり、すっと進んだり。自転は大きくうねる。' },
  { name: '④ すれ違い', desc: '内側と外側の軌道が逆回転して、ドット同士がすれ違う。自転はどっしりゆっくり。' },
  { name: '⑤ リズム', desc: 'コツン、コツンと一定のリズムで進む（データが流れるイメージ）。自転も同じリズムで刻む。' },
];

/* ================= ゆらぎ (グラフィック全体の動き 10案) ================= */
const SWAYS = [
  { name: '①固定', desc: 'ゆらぎなし。カンプの構図のまま。' },
  { name: '②ふわふわ', desc: '全体がゆっくり上下に浮き沈みする。' },
  { name: '③シーソー', desc: '全体が±3°ほどでゆっくり傾く。' },
  { name: '④うねり', desc: '2つの波が重なって傾きが複雑にうねる（歳差運動風）。' },
  { name: '⑤ジェリー', desc: '軌道の輪だけがぷにぷに伸び縮みする（惑星は固定）。' },
  { name: '⑥惑星ゆらり', desc: '惑星だけがゆっくり漂う（軌道は固定）。' },
  { name: '⑦逆位相', desc: '軌道が傾くと惑星は逆へ動き、軌道と惑星の角度が変わって見える。' },
  { name: '⑧漂流', desc: '全体が8の字を描いてゆっくり漂う。' },
  { name: '⑨呼吸', desc: '全体がわずかに膨らんだり縮んだりする。' },
  { name: '⑩波乗り', desc: '傾きと上下ゆれのミックスで、波に乗るように揺れる。' },
  { name: '⑪クロス', desc: '2本の軌道が逆方向に傾いて、たまに交差する。（軌道ごとの「ゆれ」設定でも自作できます）' },
];

/* ================= ディザ演出 (惑星E専用 5案) ================= */
const DITHERS = [
  { name: '①固定', desc: '網点は動かない。' },
  { name: '②パラパラ', desc: 'ドットが時々チカッと隣の色に入れ替わる。' },
  { name: '③流れ', desc: '網点そのものが斜めにゆっくり流れていく。' },
  { name: '④さざ波', desc: '明るさの波が球面を通り、通り道のドットがパラパラめくれる。' },
  { name: '⑤ざわめき', desc: '全体が細かくざわざわと揺らぎ続ける（砂嵐の弱いやつ）。' },
];

/* ================= 惑星デザイン (Figmaカンプ5種) =================
   カンプ画像(4倍解像度)をそのまま球面テクスチャとして貼り、
   デザインごとに専用シェーダー(finish)で質感を仕上げる。
   裏側はカンプに存在しないため鏡映で生成 (uv を d.xy から取ると表裏対称になる)。 */
const DESIGNS = {
  A: {
    name: 'A やわらかパステル',
    swatch: 'radial-gradient(circle at 30% 30%, #ffffff 15%, #ffb3d1 55%, #64d2f5 100%)',
    src: 'assets/planet-a.png',
    grainScale: '220.0',
    /* なめらかグラデ優先: 立体感は控えめ、粒はごく薄く */
    finish: `
      float hi = pow(max(dot(n, normalize(vec3(-0.48, 0.62, 0.62))), 0.0), 2.0);
      col = mix(col, vec3(1.0), hi * 0.15);
      col *= 1.0 - pow(1.0 - n.z, 2.0) * 0.06;
      col += grain * 0.05 * uNoise;`,
  },
  B: {
    name: 'B ビビッドブルー',
    swatch: 'linear-gradient(140deg, #ff5d97 5%, #ffffff 30%, #1e9bff 65%, #0b6bff 100%)',
    src: 'assets/planet-b.png',
    grainScale: '120.0',
    /* ビビッド優先: 粒は乗算で粗く、白飛びさせない */
    finish: `
      col *= 1.0 + grain * 0.5 * uNoise;
      float hi = pow(max(dot(n, normalize(vec3(-0.4, 0.65, 0.65))), 0.0), 2.5);
      col = mix(col, vec3(1.0), hi * 0.08);
      col *= 1.0 - pow(1.0 - n.z, 2.2) * 0.10;`,
  },
  C: {
    name: 'C ピンク×ブルー',
    swatch: 'linear-gradient(160deg, #ff5d97 22%, #ffffff 50%, #26a9ff 78%)',
    src: 'assets/planet-c.png',
    grainScale: '150.0',
    /* 2色の境界を活かす: 中くらいの粒を加算で */
    finish: `
      col += grain * 0.16 * uNoise;
      float hi = pow(max(dot(n, normalize(vec3(-0.45, 0.6, 0.66))), 0.0), 2.2);
      col = mix(col, vec3(1.0), hi * 0.12);
      col *= 1.0 - pow(1.0 - n.z, 2.0) * 0.08;`,
  },
  D: {
    name: 'D ライトグレイン',
    swatch: 'linear-gradient(200deg, #9fdcff 12%, #ffffff 45%, #ff9ac4 88%)',
    src: 'assets/planet-d.png',
    grainScale: '260.0',
    /* 高密度の微粒が主役: 細かい粒を強めに */
    finish: `
      col += grain * 0.20 * uNoise;
      float hi = pow(max(dot(n, normalize(vec3(-0.45, 0.6, 0.66))), 0.0), 2.2);
      col = mix(col, vec3(1.0), hi * 0.12);
      col *= 1.0 - pow(1.0 - n.z, 2.0) * 0.07;`,
  },
  E: {
    name: 'E ハーフトーンブルー',
    swatch: 'radial-gradient(circle at 68% 30%, #ffffff 8%, #5fd2ff 40%, #0e9bff 72%, #ff4fd8 100%)',
    src: 'assets/planet-e.png',   /* WebGL非対応時のフォールバック表示にのみ使用 */
    /* 完全生成のディザリング専用シェーダー:
       画像貼り付けだと網点が回転でにじみ継ぎ目も出るため、
       色のグラデを計算で作り、ベイヤーディザで1pxドットに割ってピクセル調に仕上げる */
    fragment: `
precision highp float;
uniform vec2 uRes;
uniform float uAngle;
uniform float uAngle2;
uniform float uNoise;
uniform float uTime;    /* ディザ演出用の時間 (一時停止と連動) */
uniform float uDither;  /* ディザ演出モード 1〜5 */

mat3 rotAxis(vec3 a, float t){
  float c = cos(t), s = sin(t);
  vec3 u = normalize(a);
  return mat3(
    c+u.x*u.x*(1.-c),      u.x*u.y*(1.-c)-u.z*s,  u.x*u.z*(1.-c)+u.y*s,
    u.y*u.x*(1.-c)+u.z*s,  c+u.y*u.y*(1.-c),      u.y*u.z*(1.-c)-u.x*s,
    u.z*u.x*(1.-c)-u.y*s,  u.z*u.y*(1.-c)+u.x*s,  c+u.z*u.z*(1.-c)
  );
}
float hash(vec3 p){
  p = fract(p * vec3(127.1, 311.7, 74.7));
  p += dot(p, p.yzx + 19.19);
  return fract((p.x + p.y) * p.z);
}
float vnoise(vec3 p){
  vec3 i = floor(p), f = fract(p);
  vec3 u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(mix(hash(i), hash(i+vec3(1,0,0)), u.x),
        mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), u.x), u.y),
    mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), u.x),
        mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), u.x), u.y), u.z);
}
float fbm(vec3 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 3; i++) { v += a * vnoise(p); p *= 2.03; a *= 0.5; }
  return v;
}
float bayer2(vec2 a){ a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
float bayer4(vec2 a){ return bayer2(0.5 * a) * 0.25 + bayer2(a); }
float bayer8(vec2 a){ return bayer4(0.5 * a) * 0.25 + bayer2(a); }

/* 深い青 → ブルー → シアン → 白 のカラーランプ */
vec3 ramp(float x){
  x = clamp(x, 0.0, 1.0);
  vec3 deep = vec3(0.04, 0.36, 0.86);
  vec3 blue = vec3(0.05, 0.62, 0.98);
  vec3 cyan = vec3(0.56, 0.88, 1.0);
  vec3 white = vec3(1.0);
  if (x < 0.34) return mix(deep, blue, x / 0.34);
  if (x < 0.67) return mix(blue, cyan, (x - 0.34) / 0.33);
  return mix(cyan, white, (x - 0.67) / 0.33);
}

void main(){
  float CELL = 2.0; /* ドット1粒の物理px (dpr2でCSS1px相当) */
  vec2 fcTrue = gl_FragCoord.xy;
  vec2 cellId = floor(fcTrue / CELL);
  vec2 fc = (cellId + 0.5) * CELL;   /* セル中央で色を決める → 粒が均一なピクセルに */
  vec2 pTrue = (fcTrue * 2.0 - uRes) / uRes.y;
  vec2 p = (fc * 2.0 - uRes) / uRes.y;
  float R = 0.884615;
  float px = 2.0 / uRes.y;
  float alpha = 1.0 - smoothstep(R - 1.5 * px, R + 1.5 * px, length(pTrue));
  if (alpha <= 0.0) { gl_FragColor = vec4(0.0); return; }
  float z = sqrt(max(R * R - dot(p, p), 1e-5));
  vec3 n = normalize(vec3(p, z));
  vec3 ax1 = normalize(vec3(0.53, 0.85, 0.35));
  vec3 ax2 = normalize(vec3(-0.62, 0.22, 0.76));
  vec3 d = rotAxis(ax2, uAngle2) * rotAxis(ax1, uAngle) * n;

  /* 明るさ: 右上ハイライトは画面固定(カンプ準拠)、表面の流れは球と一緒に回る */
  vec3 L = normalize(vec3(0.55, 0.52, 0.62));
  float lam = dot(n, L) * 0.5 + 0.5;
  float flow = (fbm(d * 2.2) - 0.5) * 0.4;
  /* 中央はシアン〜ブルー主体、白は右上のハイライト付近だけ (カンプ準拠) */
  float lum = clamp(lam * 0.95 - 0.15 + pow(lam, 6.0) * 0.55 + flow, 0.0, 1.0);

  /* ---- ディザ演出 ---- */
  vec2 dCell = cellId;
  if (uDither > 2.5 && uDither < 3.5) {
    /* ③流れ: 網点パターン自体が斜め下へスクロール */
    dCell = cellId + vec2(floor(uTime * 3.0), floor(uTime * 6.0));
  }
  float dith = bayer8(dCell);
  if (uDither > 1.5 && uDither < 2.5) {
    /* ②パラパラ: まばらなセルがチカッと反転 */
    float h = hash(vec3(cellId, floor(uTime * 3.0) * 0.173));
    if (h > 0.92) dith = fract(dith + 0.5);
  } else if (uDither > 4.5) {
    /* ⑤ざわめき: しきい値が細かく揺らぎ続ける */
    dith = fract(dith + (hash(vec3(cellId, floor(uTime * 6.0) * 0.031)) - 0.5) * 0.6);
  }
  if (uDither > 3.5 && uDither < 4.5) {
    /* ④さざ波: 明るさの波が通過して境目のドットがめくれる */
    lum += sin((p.x + p.y) * 9.0 - uTime * 2.2) * 0.06;
  }

  /* ベイヤーディザ: 階調を段に割って、隣のセルと交互に混ぜる → 網点 */
  float spread = 0.8 + uNoise * 1.2;
  float levels = 6.0;
  float q = clamp(floor(lum * levels + (dith - 0.5) * spread + 0.5) / levels, 0.0, 1.0);
  vec3 col = ramp(q);

  /* 左下のマゼンタリム (これもディザで混ぜる) */
  float rim = pow(1.0 - n.z, 1.6) * clamp(dot(normalize(n.xy + vec2(1e-4)), normalize(vec2(-0.7, -0.6))), 0.0, 1.0);
  float mg = clamp(floor((rim * 1.5 + flow * 0.25) * 3.0 + (dith - 0.5) * 1.3 + 0.5) / 3.0, 0.0, 1.0);
  col = mix(col, vec3(1.0, 0.27, 0.78), mg * 0.92);

  gl_FragColor = vec4(col * alpha, alpha);
}`,
  },
};

/* ================= 調整パラメーター ================= */
const DEFAULTS = {
  running: true,
  pattern: 1,        // アニメパターン 1〜5
  sway: 1,           // ゆらぎ 1〜11
  design: 'A',       // 惑星デザイン A〜E
  dither: 1,         // ディザ演出 1〜5 (惑星E専用)
  duration: 24,      // ドット1周の基準秒数
  globalSpeed: 1,    // 全体スピード倍率
  direction: 1,      // 1=時計回り / -1=反時計回り
  ramp: 1.5,         // 動き出しのなめらか加速(秒)
  pulse: {
    amp: 0.5,        // 緩急の強さ (0=一定速度, 1=一瞬止まるくらい)
    period: 8,       // 緩急の周期(秒)
  },
  sphere: {
    duration: 32,    // 球体1回転の秒数
    tumble: 0.37,    // 多面ゆらぎ (2軸目の回転比率)
    noise: 0.5,      // 質感の粒の強さ
  },
  planet: { dx: 0, dy: 0, scale: 1 },   // 惑星の位置ずらし(px)と大きさ
  orbits: {
    /* 軌道ごと: サイズ倍率 / 角度ずらし(°) / 位置ずらし(px) / ゆれ(幅°・周期s・位相°) */
    outer: { scale: 1, angle: 0, dx: 0, dy: 0, wobbleAmp: 0, wobblePeriod: 12, wobblePhase: 0 },
    inner: { scale: 1, angle: 0, dx: 0, dy: 0, wobbleAmp: 0, wobblePeriod: 12, wobblePhase: 180 },
  },
  marquee: {
    duration: 30,    // ロゴが1周する秒数
    direction: 1,    // 1=左へ / -1=右へ
  },
  dots: DOTS.map((_, i) => ({ speed: 1, delay: 0, offset: 0, pulsePhase: i * 60 })),
};
const STORAGE_KEY = 'anyflow-embed-anim-v3';

let params = load();
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (s && Array.isArray(s.dots) && s.dots.length === DOTS.length) {
      const merged = { ...structuredClone(DEFAULTS), ...s };
      merged.pulse = { ...DEFAULTS.pulse, ...(s.pulse || {}) };
      merged.sphere = { ...DEFAULTS.sphere, ...(s.sphere || {}) };
      merged.planet = { ...DEFAULTS.planet, ...(s.planet || {}) };
      merged.orbits = {
        outer: { ...DEFAULTS.orbits.outer, ...((s.orbits && s.orbits.outer) || {}) },
        inner: { ...DEFAULTS.orbits.inner, ...((s.orbits && s.orbits.inner) || {}) },
      };
      merged.marquee = { ...DEFAULTS.marquee, ...(s.marquee || {}) };
      merged.dots = s.dots.map((d, i) => ({ ...DEFAULTS.dots[i], ...d }));
      return merged;
    }
  } catch (e) {}
  return structuredClone(DEFAULTS);
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(params)); }

/* ================= ドット要素 (奥/手前レイヤーに1個ずつ) ================= */
const SVG_NS = 'http://www.w3.org/2000/svg';
const dotsBackG = document.getElementById('dotsBack');
const dotsFrontG = document.getElementById('dotsFront');
const dotEls = DOTS.map(d => {
  const mk = () => {
    const c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('r', DOT_R);
    c.setAttribute('fill', d.color);
    return c;
  };
  const back = mk(), front = mk();
  dotsBackG.appendChild(back);
  dotsFrontG.appendChild(front);
  return { back, front };
});

/* 現在の軌道ジオメトリ = カンプ基準値 × パネル設定 (サイズ/角度/位置) + ゆれ */
function orbitGeom(key) {
  const b = ELLIPSES[key];
  const p = params.orbits[key];
  let wobble = 0;
  if (p.wobbleAmp > 0 && p.wobblePeriod > 0) {
    wobble = p.wobbleAmp * Math.sin(2 * Math.PI * elapsed / p.wobblePeriod + p.wobblePhase * Math.PI / 180);
  }
  if (params.sway === 11) { /* クロスプリセット: 2本が逆方向に傾く */
    wobble += (key === 'outer' ? 6 : -6) * Math.sin(2 * Math.PI * elapsed / 10);
  }
  return {
    cx: b.cx + p.dx, cy: b.cy + p.dy,
    rx: b.rx * p.scale, ry: b.ry * p.scale,
    rot: ROTDEG + p.angle + wobble,
  };
}

function posOn(g, deg) {
  const t = deg * Math.PI / 180;
  const rot = g.rot * Math.PI / 180;
  const lx = g.rx * Math.cos(t), ly = g.ry * Math.sin(t);
  return {
    x: g.cx + lx * Math.cos(rot) - ly * Math.sin(rot),
    y: g.cy + lx * Math.sin(rot) + ly * Math.cos(rot),
    front: Math.sin(t) > 0,   // 楕円ローカルで下半分 = 手前側
  };
}

/* 軌道SVG(奥/手前の楕円・クリップ・グラデ)へジオメトリを反映 */
const orbitSvgEls = {
  outer: {
    ells: [document.getElementById('ellOuterB'), document.getElementById('ellOuterF')],
    clip: document.getElementById('clipOuterRect'),
    grads: [document.getElementById('gOuterB'), document.getElementById('gOuterF')],
  },
  inner: {
    ells: [document.getElementById('ellInnerB'), document.getElementById('ellInnerF')],
    clip: document.getElementById('clipInnerRect'),
    grads: [document.getElementById('gInnerB'), document.getElementById('gInnerF')],
  },
};

function updateOrbitSvg(geoms) {
  for (const key of ['outer', 'inner']) {
    const g = geoms[key], els = orbitSvgEls[key];
    const tr = `rotate(${g.rot} ${g.cx} ${g.cy})`;
    for (const el of els.ells) {
      el.setAttribute('cx', g.cx); el.setAttribute('cy', g.cy);
      el.setAttribute('rx', g.rx); el.setAttribute('ry', g.ry);
      el.setAttribute('transform', tr);
    }
    els.clip.setAttribute('x', -(g.rx + 24));
    els.clip.setAttribute('width', (g.rx + 24) * 2);
    els.clip.setAttribute('height', g.ry + 26);
    els.clip.setAttribute('transform', `translate(${g.cx} ${g.cy}) rotate(${g.rot})`);
    for (const gr of els.grads) {
      gr.setAttribute('x1', g.cx); gr.setAttribute('x2', g.cx);
      gr.setAttribute('y1', g.cy - g.ry); gr.setAttribute('y2', g.cy + g.ry);
    }
  }
}

/* 遅延後になめらかに加速するための実効経過時間 */
function effectiveTime(t, delay, ramp) {
  const pt = t - delay;
  if (pt <= 0) return 0;
  if (ramp <= 0 || pt >= ramp) return pt - ramp / 2;
  return (pt * pt) / (2 * ramp);
}

/* 緩急: 速度 v(t) = 1 + amp*sin(2πt/period + φ) を積分した実効時間 */
function warpTime(t, amp, period, phaseDeg) {
  if (amp <= 0 || period <= 0) return t;
  const w = 2 * Math.PI / period;
  const ph = phaseDeg * Math.PI / 180;
  return t - (amp / w) * (Math.cos(w * t + ph) - Math.cos(ph));
}

let elapsed = 0;      // 再生中のみ進む累積時間
let lastTs = null;

/* ステップ&グライド: ph(周期単位) → コツンと進む累積量 */
function stepGlide(ph) {
  const k = Math.floor(ph), f = ph - k;
  const g = Math.min(1, f / 0.4);           // 周期の前半40%で移動、残りは静止
  const ease = g * g * (3 - 2 * g);
  return k + ease;
}

/* パターン別: ドットの現在角度(deg)を返す */
function patternDeg(d, i, p) {
  const base = 360 / params.duration * params.globalSpeed * params.direction;
  const et = effectiveTime(elapsed, p.delay, params.ramp);
  switch (params.pattern) {
    case 2: { /* コメット: 軌道上の位置で加減速 (惑星の裏側あたりで最速) */
      const lin = d.angle + p.offset + base * p.speed * et;
      return lin + 45 * Math.sin((lin - 270) * Math.PI / 180);
    }
    case 3: { /* ドリフト: 周期の違うサイン波を重ねた気まぐれな漂い */
      const a = 0.4 + params.pulse.amp;
      const n = (2.2 * Math.sin(0.23 * et + i * 2.7)
               + 1.3 * Math.sin(0.53 * et + i * 1.9)
               + 0.7 * Math.sin(1.13 * et + i * 5.1)) * a * 0.45;
      return d.angle + p.offset + base * p.speed * (et + n);
    }
    case 4: { /* すれ違い: 内側の軌道だけ逆回転 */
      const dir = d.ellipse === 'inner' ? -1 : 1;
      return d.angle + p.offset + base * p.speed * dir * et * (0.85 + 0.06 * i);
    }
    case 5: { /* リズム: 45°ずつコツンと進む (ドットごとに少し時間差) */
      const period = params.duration / 8 / params.globalSpeed;
      const ph = et / period + i * 0.37;
      return d.angle + p.offset + params.direction * 45 * stepGlide(ph);
    }
    default: { /* スタンダード: 緩急ゆらぎ */
      const wt = warpTime(et, params.pulse.amp, params.pulse.period, p.pulsePhase);
      return d.angle + p.offset + base * p.speed * wt;
    }
  }
}

function renderFrame() {
  const geoms = { outer: orbitGeom('outer'), inner: orbitGeom('inner') };
  updateOrbitSvg(geoms);
  DOTS.forEach((d, i) => {
    const p = params.dots[i];
    const deg = patternDeg(d, i, p);
    const pos = posOn(geoms[d.ellipse], deg);
    const els = dotEls[i];
    [els.back, els.front].forEach(el => {
      el.setAttribute('cx', pos.x);
      el.setAttribute('cy', pos.y);
    });
    els.front.style.display = pos.front ? '' : 'none';
    els.back.style.display = pos.front ? 'none' : '';
  });
  applySway();
  renderSphere();
}

/* ゆらぎ: グラフィック全体(軌道・惑星)へのゆるい動き */
const swayEls = {
  orbit: document.querySelector('.orbit'),
  svgs: [...document.querySelectorAll('.orbit svg')],
  sphere: document.getElementById('sphere'),
};

function applySway() {
  const t = elapsed;
  let orbit = '', svg = '', sph = '';
  switch (params.sway) {
    case 2: /* ふわふわ */
      orbit = `translateY(${(Math.sin(t * 0.5) * 10).toFixed(2)}px)`; break;
    case 3: /* シーソー */
      orbit = `rotate(${(Math.sin(t * 0.4) * 3).toFixed(3)}deg)`; break;
    case 4: /* うねり (歳差運動風) */
      orbit = `rotate(${(Math.sin(t * 0.35) * 4 + Math.sin(t * 0.13 + 1.7) * 2.5).toFixed(3)}deg)`; break;
    case 5: /* ジェリー (軌道の輪だけ伸縮) */
      svg = `scale(${(1 + Math.sin(t * 0.6) * 0.02).toFixed(4)}, ${(1 - Math.sin(t * 0.6) * 0.03).toFixed(4)})`; break;
    case 6: /* 惑星ゆらり (軌道は固定) */
      sph = `translate(${(Math.sin(t * 0.45) * 6).toFixed(2)}px, ${(Math.sin(t * 0.6 + 1.2) * 8).toFixed(2)}px)`; break;
    case 7: /* 逆位相 (軌道と惑星の角度が変わる) */
      svg = `rotate(${(Math.sin(t * 0.4) * 2.5).toFixed(3)}deg)`;
      sph = `translateY(${(-Math.sin(t * 0.4) * 9).toFixed(2)}px)`; break;
    case 8: /* 漂流 (8の字) */
      orbit = `translate(${(Math.sin(t * 0.3) * 9).toFixed(2)}px, ${(Math.sin(t * 0.6) * 5).toFixed(2)}px)`; break;
    case 9: /* 呼吸 */
      orbit = `scale(${(1 + Math.sin(t * 0.5) * 0.01).toFixed(4)})`; break;
    case 10: /* 波乗り */
      orbit = `rotate(${(Math.sin(t * 0.4) * 2.5).toFixed(3)}deg) translateY(${(Math.sin(t * 0.55 + 0.8) * 7).toFixed(2)}px)`; break;
  }
  swayEls.orbit.style.transform = orbit;
  swayEls.svgs.forEach(s => s.style.transform = svg);
  /* 惑星の位置・サイズ (パネル設定) を ゆらぎ の上に合成 */
  const pl = params.planet;
  const plT = (pl.dx || pl.dy || pl.scale !== 1)
    ? ` translate(${pl.dx}px, ${pl.dy}px) scale(${pl.scale})` : '';
  swayEls.sphere.style.transform = (sph + plT).trim();
}

/* ================= 球体 (WebGL / 2Dグラデを3D回転) ================= */
const sphereCanvas = document.getElementById('sphere');
let sphereGL = null;

function initSphere() {
  const gl = sphereCanvas.getContext('webgl', { alpha: true, antialias: true, premultipliedAlpha: true });
  if (!gl) { sphereFallback(); return; }

  const vs = `attribute vec2 aPos; void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;

  /* 共通部にデザイン専用の仕上げ(finish)・補助関数(helpers)・粒の細かさを差し込み、惑星ごとに別シェーダーを作る */
  const fsTemplate = (grainScale, finish, helpers) => `
precision highp float;
uniform vec2 uRes;
uniform float uAngle;    /* 主回転 (rad) */
uniform float uAngle2;   /* 2軸目の回転 (rad) */
uniform float uNoise;    /* 追い粒の強さ (カンプ由来の質感に上乗せ) */
uniform sampler2D uTex;  /* カンプの惑星画像 (4倍解像度) */

mat3 rotAxis(vec3 a, float t){
  float c = cos(t), s = sin(t);
  vec3 u = normalize(a);
  return mat3(
    c+u.x*u.x*(1.-c),      u.x*u.y*(1.-c)-u.z*s,  u.x*u.z*(1.-c)+u.y*s,
    u.y*u.x*(1.-c)+u.z*s,  c+u.y*u.y*(1.-c),      u.y*u.z*(1.-c)-u.x*s,
    u.z*u.x*(1.-c)-u.y*s,  u.z*u.y*(1.-c)+u.x*s,  c+u.z*u.z*(1.-c)
  );
}
float hash(vec3 p){
  p = fract(p * vec3(127.1, 311.7, 74.7));
  p += dot(p, p.yzx + 19.19);
  return fract((p.x + p.y) * p.z);
}
${helpers || ''}
void main(){
  vec2 p = (gl_FragCoord.xy * 2.0 - uRes) / uRes.y;
  float R = 0.884615; /* 230px / 260px */
  float len = length(p);
  float px = 2.0 / uRes.y;
  float alpha = 1.0 - smoothstep(R - 1.5 * px, R + 1.5 * px, len);
  if (alpha <= 0.0) { gl_FragColor = vec4(0.0); return; }
  float z = sqrt(max(R * R - dot(p, p), 1e-5));
  vec3 n = normalize(vec3(p, z));

  /* 回転軸: 軌道の傾き(-23°)とはずらした斜め軸 + ゆっくり別軸 → 多面的 */
  vec3 ax1 = normalize(vec3(0.53, 0.85, 0.35));
  vec3 ax2 = normalize(vec3(-0.62, 0.22, 0.76));
  vec3 d = rotAxis(ax2, uAngle2) * rotAxis(ax1, uAngle) * n;

  /* カンプ画像を球面に貼る: 回転後の向き d から画像の色を拾う。
     無回転ならカンプがピクセルそのまま出る。裏側(d.z<0)はカンプに無いので鏡映で生成 */
  vec2 uv = vec2(0.5 + d.x * 0.47, 0.5 - d.y * 0.47);
  vec3 col = texture2D(uTex, uv).rgb;

  /* 球の表面に張り付いた粒 (球と一緒に回る) */
  float grain = hash(floor(d * ${grainScale}) + 0.5) - 0.5;

  /* ---- デザイン専用の仕上げ ---- */
  ${finish}

  gl_FragColor = vec4(col * alpha, alpha);
}`;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(sh));
      return null;
    }
    return sh;
  }
  const v = compile(gl.VERTEX_SHADER, vs);
  if (!v) { sphereFallback(); return; }

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

  const dpr = Math.min(2, window.devicePixelRatio || 1);
  sphereCanvas.width = 260 * dpr;
  sphereCanvas.height = 260 * dpr;
  gl.viewport(0, 0, sphereCanvas.width, sphereCanvas.height);

  const progs = {};
  for (const [key, ds] of Object.entries(DESIGNS)) {
    /* fragment があるデザインは完全カスタムシェーダー (テクスチャ不使用) */
    const fsSrc = ds.fragment || fsTemplate(ds.grainScale, ds.finish, ds.helpers);
    const f = compile(gl.FRAGMENT_SHADER, fsSrc);
    if (!f) { sphereFallback(); return; }
    const prog = gl.createProgram();
    gl.attachShader(prog, v);
    gl.attachShader(prog, f);
    gl.linkProgram(prog);
    gl.useProgram(prog);
    const loc = gl.getAttribLocation(prog, 'aPos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    gl.uniform2f(gl.getUniformLocation(prog, 'uRes'), sphereCanvas.width, sphereCanvas.height);
    progs[key] = {
      prog,
      needsTex: !ds.fragment,
      uAngle: gl.getUniformLocation(prog, 'uAngle'),
      uAngle2: gl.getUniformLocation(prog, 'uAngle2'),
      uNoise: gl.getUniformLocation(prog, 'uNoise'),
      uTime: gl.getUniformLocation(prog, 'uTime'),
      uDither: gl.getUniformLocation(prog, 'uDither'),
    };
    if (!ds.fragment) {
      gl.uniform1i(gl.getUniformLocation(prog, 'uTex'), 0);
      /* カンプ画像をテクスチャとして読み込み (読み込み完了したら描画) */
      const tex = gl.createTexture();
      const img = new Image();
      img.onload = () => {
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        progs[key].tex = tex;
        renderSphere();
      };
      img.src = ds.src;
    }
  }
  sphereGL = { gl, progs };
}

/* WebGLが使えない環境: カンプ画像をそのまま表示 */
function sphereFallback() {
  sphereGL = null;
  sphereCanvas.classList.add('fallback');
  const ds = DESIGNS[params.design] || DESIGNS.A;
  sphereCanvas.style.backgroundImage = `url('${ds.src}')`;
}

/* パターン別: 球体の回転角 (主回転, 2軸目) */
function sphereAngles() {
  const sp = params.sphere;
  switch (params.pattern) {
    case 2: { const a = 2 * Math.PI * elapsed / (sp.duration * 0.75); return [a, a * sp.tumble]; }
    case 3: { const a = 2 * Math.PI * elapsed / (sp.duration * 1.3); return [a, a * Math.max(0.8, sp.tumble)]; }
    case 4: { const a = 2 * Math.PI * elapsed / (sp.duration * 1.5); return [a, a * sp.tumble * 0.4]; }
    case 5: { /* ドットと同じリズムで刻む */
      const period = params.duration / 8 / params.globalSpeed;
      const a = 2 * Math.PI / 8 * stepGlide(elapsed / period) * (sp.duration ? 32 / sp.duration : 1);
      return [a, a * sp.tumble];
    }
    default: { const a = 2 * Math.PI * elapsed / sp.duration; return [a, a * sp.tumble]; }
  }
}

function renderSphere() {
  if (!sphereGL) {
    if (sphereCanvas.classList.contains('fallback')) {
      const ds = DESIGNS[params.design] || DESIGNS.A;
      sphereCanvas.style.backgroundImage = `url('${ds.src}')`;
    }
    return;
  }
  const { gl, progs } = sphereGL;
  const pr = progs[params.design] || progs.A;
  if (!pr || (pr.needsTex && !pr.tex)) return;
  const [ang, ang2] = sphereAngles();
  gl.useProgram(pr.prog);
  if (pr.tex) {
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, pr.tex);
  }
  gl.uniform1f(pr.uAngle, ang);
  gl.uniform1f(pr.uAngle2, ang2);
  gl.uniform1f(pr.uNoise, params.sphere.noise);
  if (pr.uTime) gl.uniform1f(pr.uTime, elapsed);
  if (pr.uDither) gl.uniform1f(pr.uDither, params.dither || 1);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
initSphere();

/* ロゴカルーセルへパラメーターを反映 */
const marqueeTrack = document.getElementById('marqueeTrack');
function applyMarquee() {
  marqueeTrack.style.animationDuration = params.marquee.duration + 's';
  marqueeTrack.style.animationDirection = params.marquee.direction === 1 ? 'normal' : 'reverse';
  marqueeTrack.style.animationPlayState = params.running ? 'running' : 'paused';
}

function frame(ts) {
  if (lastTs !== null && params.running) {
    elapsed += Math.min(0.1, (ts - lastTs) / 1000);
  }
  lastTs = ts;
  renderFrame();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
renderFrame();

/* デバッグ用フック（rAFが動かない環境で手動で時間を進める） */
window.__anim = {
  step(dt) { elapsed += dt; renderFrame(); },
  setElapsed(v) { elapsed = v; renderFrame(); },
  setPattern(n) { params.pattern = n; renderFrame(); },
  setSway(n) { params.sway = n; renderFrame(); },
  setDesign(k) { params.design = k; renderFrame(); },
  setDither(n) { params.dither = n; renderFrame(); },
  getState() { return { elapsed, params }; },
};

/* ================= ステージのスケーリング ================= */
const stage = document.getElementById('stage');
function fit() {
  const s = Math.min(1, window.innerWidth / 1440);
  stage.style.transform = `scale(${s})`;
  stage.parentElement.style.height = (921 * s) + 'px';
}
window.addEventListener('resize', fit);
fit();

/* ================= 調整パネル UI ================= */
const body = document.getElementById('panelBody');

function slider(label, min, max, step, get, set, fmt) {
  const row = document.createElement('div');
  row.className = 'row';
  const lab = document.createElement('label');
  lab.textContent = label;
  const input = document.createElement('input');
  input.type = 'range';
  input.min = min; input.max = max; input.step = step;
  input.value = get();
  const val = document.createElement('span');
  val.className = 'val';
  const f = fmt || (v => v);
  val.textContent = f(get());
  input.addEventListener('input', () => {
    set(parseFloat(input.value));
    val.textContent = f(parseFloat(input.value));
    save();
  });
  row.append(lab, input, val);
  row._sync = () => { input.value = get(); val.textContent = f(get()); };
  mount.appendChild(row);
  return row;
}

const rows = [];
let mount = null;   // slider() などの追加先 (現在の小カテゴリの親)

/* 大カテゴリ (開閉できる箱) */
function category(title, open) {
  const cat = document.createElement('div');
  cat.className = 'cat' + (open ? '' : ' closed');
  const head = document.createElement('div');
  head.className = 'cat-head';
  head.innerHTML = `<span>${title}</span><span class="cat-chev">▾</span>`;
  const content = document.createElement('div');
  content.className = 'cat-body';
  head.onclick = () => cat.classList.toggle('closed');
  cat.append(head, content);
  body.appendChild(cat);
  return content;
}

/* 小カテゴリ (見出し行) — 以降の slider は同じカテゴリに追加される */
function sub(target, html) {
  const g = document.createElement('div');
  g.className = 'grp';
  g.innerHTML = `<div class="grp-title">${html}</div>`;
  target.appendChild(g);
  mount = target;
}

/* 方向切替の2択ボタン行 */
function segRow(label, opts, getDir, setDir) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<label>${label}</label>`;
  const seg = document.createElement('div');
  seg.className = 'seg';
  const bs = opts.map(([text, value]) => {
    const b = document.createElement('button');
    b.textContent = text;
    b.onclick = () => { setDir(value); sync(); };
    seg.appendChild(b);
    return [b, value];
  });
  function sync() { bs.forEach(([b, value]) => b.classList.toggle('on', getDir() === value)); }
  sync();
  row.appendChild(seg);
  mount.appendChild(row);
}

function buildPanel() {
  body.innerHTML = '';
  rows.length = 0;

  /* ========== 🪐 惑星（球体） ========== */
  const catPlanet = category('🪐 惑星（球体）', true);
  sub(catPlanet, '自転');
  rows.push(slider('1回転の秒数', 8, 120, 1, () => params.sphere.duration, v => params.sphere.duration = v, v => v + 's'));
  rows.push(slider('多面ゆらぎ', 0, 1, 0.01, () => params.sphere.tumble, v => params.sphere.tumble = v, v => Math.round(v * 100) + '%'));
  rows.push(slider('質感の粒', 0, 1, 0.05, () => params.sphere.noise, v => params.sphere.noise = v, v => Math.round(v * 100) + '%'));
  sub(catPlanet, '位置・サイズ');
  rows.push(slider('X位置', -250, 250, 1, () => params.planet.dx, v => params.planet.dx = v, v => v + 'px'));
  rows.push(slider('Y位置', -250, 250, 1, () => params.planet.dy, v => params.planet.dy = v, v => v + 'px'));
  rows.push(slider('大きさ', 0.4, 1.8, 0.01, () => params.planet.scale, v => params.planet.scale = v, v => '×' + v.toFixed(2)));

  /* ========== 🛰 軌道（2本を個別に） ========== */
  const catOrbit = category('🛰 軌道（外側・内側を個別に）', false);
  [['outer', '外側の軌道', '#FF5D97'], ['inner', '内側の軌道', '#00ABEB']].forEach(([key, label, color]) => {
    sub(catOrbit, `<span class="chip" style="background:${color}"></span>${label}`);
    const o = () => params.orbits[key];
    rows.push(slider('サイズ', 0.5, 1.5, 0.01, () => o().scale, v => o().scale = v, v => '×' + v.toFixed(2)));
    rows.push(slider('角度', -45, 45, 0.5, () => o().angle, v => o().angle = v, v => v + '°'));
    rows.push(slider('X位置', -200, 200, 1, () => o().dx, v => o().dx = v, v => v + 'px'));
    rows.push(slider('Y位置', -200, 200, 1, () => o().dy, v => o().dy = v, v => v + 'px'));
    rows.push(slider('ゆれ幅', 0, 20, 0.5, () => o().wobbleAmp, v => o().wobbleAmp = v, v => v + '°'));
    rows.push(slider('ゆれ周期', 2, 30, 0.5, () => o().wobblePeriod, v => o().wobblePeriod = v, v => v.toFixed(1) + 's'));
    rows.push(slider('ゆれ位相', 0, 360, 5, () => o().wobblePhase, v => o().wobblePhase = v, v => v + '°'));
  });

  /* ========== ⚪ ドット（周回） ========== */
  const catDots = category('⚪ ドット（周回）', false);
  sub(catDots, '全体');
  rows.push(slider('1周の秒数', 4, 80, 1, () => params.duration, v => params.duration = v, v => v + 's'));
  rows.push(slider('スピード倍率', 0.1, 3, 0.05, () => params.globalSpeed, v => params.globalSpeed = v, v => '×' + v.toFixed(2)));
  rows.push(slider('なめらか加速', 0, 5, 0.1, () => params.ramp, v => params.ramp = v, v => v.toFixed(1) + 's'));
  segRow('回転方向', [['時計回り', 1], ['反時計回り', -1]],
    () => params.direction, v => { params.direction = v; save(); });
  sub(catDots, '緩急<span style="color:#999;font-weight:300">（速い⇄遅いのゆらぎ）</span>');
  rows.push(slider('強さ', 0, 1, 0.05, () => params.pulse.amp, v => params.pulse.amp = v, v => Math.round(v * 100) + '%'));
  rows.push(slider('周期', 1, 20, 0.5, () => params.pulse.period, v => params.pulse.period = v, v => v.toFixed(1) + 's'));
  DOTS.forEach((d, i) => {
    sub(catDots, `<span class="chip" style="background:${d.color}"></span>${d.name}<span style="color:#999;font-weight:300">（${d.ellipse === 'outer' ? '外側' : '内側'}）</span>`);
    rows.push(slider('スピード倍率', 0, 3, 0.05, () => params.dots[i].speed, v => params.dots[i].speed = v, v => '×' + v.toFixed(2)));
    rows.push(slider('遅延', 0, 10, 0.1, () => params.dots[i].delay, v => params.dots[i].delay = v, v => v.toFixed(1) + 's'));
    rows.push(slider('開始位置', -180, 180, 1, () => params.dots[i].offset, v => params.dots[i].offset = v, v => v + '°'));
    rows.push(slider('緩急ずらし', 0, 360, 5, () => params.dots[i].pulsePhase, v => params.dots[i].pulsePhase = v, v => v + '°'));
  });

  /* ========== 🎞 ロゴカルーセル ========== */
  const catLogo = category('🎞 ロゴカルーセル', false);
  sub(catLogo, '流れ方');
  rows.push(slider('1周の秒数', 5, 120, 1, () => params.marquee.duration, v => { params.marquee.duration = v; applyMarquee(); }, v => v + 's'));
  segRow('流れる方向', [['← 左へ', 1], ['右へ →', -1]],
    () => params.marquee.direction, v => { params.marquee.direction = v; applyMarquee(); save(); });

  /* ボタン */
  const btns = document.createElement('div');
  btns.className = 'btns';
  const playBtn = document.createElement('button');
  playBtn.className = 'primary';
  function syncPlay() { playBtn.textContent = params.running ? '⏸ 一時停止' : '▶ 再生'; }
  playBtn.onclick = () => { params.running = !params.running; syncPlay(); applyMarquee(); save(); };
  syncPlay();
  const restartBtn = document.createElement('button');
  restartBtn.textContent = '↺ 最初から';
  restartBtn.onclick = () => { elapsed = 0; };
  const resetBtn = document.createElement('button');
  resetBtn.textContent = '初期値に戻す';
  resetBtn.onclick = () => {
    params = structuredClone(DEFAULTS);
    elapsed = 0;
    save();
    buildPanel();
    buildSwitcher();
    applyMarquee();
  };
  btns.append(playBtn, restartBtn, resetBtn);
  body.appendChild(btns);
}
buildPanel();
applyMarquee();

/* ================= パターン/惑星スイッチャー ================= */
function buildSwitcher() {
  const pRow = document.getElementById('swPatterns');
  const sRow = document.getElementById('swSways');
  const dRow = document.getElementById('swDesigns');
  const diRow = document.getElementById('swDithers');
  const desc = document.getElementById('swDesc');
  pRow.querySelectorAll('.sw-pill').forEach(el => el.remove());
  sRow.querySelectorAll('.sw-pill').forEach(el => el.remove());
  dRow.querySelectorAll('.sw-pill').forEach(el => el.remove());
  diRow.querySelectorAll('.sw-pill').forEach(el => el.remove());

  function syncDitherRow() {
    diRow.style.display = params.design === 'E' ? '' : 'none';
  }
  function syncDesc() {
    let html =
      'アニメ: ' + PATTERNS[params.pattern - 1].desc +
      '<br>ゆらぎ: ' + SWAYS[params.sway - 1].desc;
    if (params.design === 'E') {
      html += '<br>ディザ: ' + DITHERS[params.dither - 1].desc;
    }
    desc.innerHTML = html;
  }
  PATTERNS.forEach((pt, i) => {
    const b = document.createElement('button');
    b.className = 'sw-pill';
    b.textContent = pt.name;
    const sync = () => b.classList.toggle('on', params.pattern === i + 1);
    b.onclick = () => {
      params.pattern = i + 1;
      pRow.querySelectorAll('.sw-pill').forEach((el, j) => el.classList.toggle('on', params.pattern === j + 1));
      syncDesc();
      save();
    };
    sync();
    pRow.appendChild(b);
  });
  SWAYS.forEach((sw, i) => {
    const b = document.createElement('button');
    b.className = 'sw-pill';
    b.textContent = sw.name;
    const sync = () => b.classList.toggle('on', params.sway === i + 1);
    b.onclick = () => {
      params.sway = i + 1;
      sRow.querySelectorAll('.sw-pill').forEach((el, j) => el.classList.toggle('on', params.sway === j + 1));
      syncDesc();
      save();
    };
    sync();
    sRow.appendChild(b);
  });
  Object.entries(DESIGNS).forEach(([key, ds]) => {
    const b = document.createElement('button');
    b.className = 'sw-pill';
    const sw = document.createElement('span');
    sw.className = 'sw-swatch';
    sw.style.background = ds.swatch;
    b.append(sw, document.createTextNode(ds.name));
    const sync = () => b.classList.toggle('on', params.design === key);
    b.onclick = () => {
      params.design = key;
      dRow.querySelectorAll('.sw-pill').forEach(el => el.classList.remove('on'));
      b.classList.add('on');
      syncDitherRow();
      syncDesc();
      save();
    };
    sync();
    dRow.appendChild(b);
  });
  DITHERS.forEach((dt, i) => {
    const b = document.createElement('button');
    b.className = 'sw-pill';
    b.textContent = dt.name;
    const sync = () => b.classList.toggle('on', params.dither === i + 1);
    b.onclick = () => {
      params.dither = i + 1;
      diRow.querySelectorAll('.sw-pill').forEach((el, j) => el.classList.toggle('on', params.dither === j + 1));
      syncDesc();
      save();
    };
    sync();
    diRow.appendChild(b);
  });
  syncDitherRow();
  syncDesc();
}
buildSwitcher();

/* パネル開閉 */
const panel = document.getElementById('panel');
document.getElementById('panelHead').addEventListener('click', () => {
  panel.classList.toggle('closed');
});
</script>
</body>
